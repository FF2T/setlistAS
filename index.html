<title>Répertoire</title>

<style>
  :root{
    --bg: #221B17;
    --bg-raised: #2C2420;
    --bg-raised-2: #362D27;
    --cream: #F0E6D8;
    --cream-dim: #C9BCA9;
    --line: #453A32;
    --gtr: #D9A441;
    --bass: #4C8577;
    --drm: #C1443C;
    --vox: #3E6E8E;
    --ok: #6E9B6E;
    --keys: #9B7BB8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--cream);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:760px;margin:0 auto;padding:28px 18px 60px;}
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2rem;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .subtitle{color:var(--cream-dim);font-size:0.92rem;margin:0 0 22px;line-height:1.5;}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;}
  .tab{
    background:none;border:none;color:var(--cream-dim);
    font-family:'IBM Plex Sans',sans-serif;font-size:0.92rem;font-weight:500;
    padding:10px 4px;margin-right:18px;cursor:pointer;
    border-bottom:2px solid transparent;transition:color .15s, border-color .15s;
  }
  .tab.active{color:var(--cream);border-bottom-color:var(--gtr);}
  .tab:hover{color:var(--cream);}
  input[type=text]{
    width:100%;background:var(--bg-raised);border:1px solid var(--line);
    color:var(--cream);padding:10px 12px;border-radius:6px;font-family:inherit;font-size:0.9rem;
  }
  input[type=text]:focus{outline:none;border-color:var(--gtr);}
  .search{margin-bottom:16px;}
  .song-card{
    background:var(--bg-raised);border:1px solid var(--line);border-radius:8px;
    padding:14px 16px;margin-bottom:10px;
  }
  .song-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .song-title{font-weight:600;font-size:0.98rem;}
  .song-artist{color:var(--cream-dim);font-size:0.85rem;}
  .song-num{font-family:'IBM Plex Mono',monospace;font-size:0.75rem;color:var(--cream-dim);opacity:.7;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .tag{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 9px;border-radius:20px;font-size:0.78rem;font-weight:500;
    border:1px solid transparent;
  }
  .tag .names{opacity:.85;font-weight:400;}
  .tag-empty{color:var(--cream-dim);opacity:.5;font-size:0.78rem;font-style:italic;}
  .artist-header{
    font-family:'Fraunces', serif;font-weight:600;font-size:1.05rem;color:var(--gtr);
    margin:22px 0 8px;padding-top:10px;border-top:1px solid var(--line);
  }
  .artist-header:first-child{margin-top:0;border-top:none;padding-top:0;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .tag.gtr{background:rgba(217,164,65,.14);color:var(--gtr);}
  .tag.gtr .dot{background:var(--gtr);}
  .tag.bass{background:rgba(76,133,119,.16);color:var(--bass);}
  .tag.bass .dot{background:var(--bass);}
  .tag.drm{background:rgba(193,68,60,.14);color:var(--drm);}
  .tag.drm .dot{background:var(--drm);}
  .tag.vox{background:rgba(62,110,142,.16);color:var(--vox);}
  .tag.vox .dot{background:var(--vox);}
  .note{
    background:var(--bg-raised-2);border:1px dashed var(--line);border-radius:8px;
    padding:10px 14px;font-size:0.82rem;color:var(--cream-dim);margin-bottom:16px;line-height:1.5;
  }
  .btn{
    background:var(--gtr);color:#221B17;border:none;border-radius:6px;
    padding:9px 16px;font-family:inherit;font-weight:600;font-size:0.85rem;cursor:pointer;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn-ghost{
    background:none;border:1px solid var(--line);color:var(--cream);
    padding:8px 14px;border-radius:6px;font-family:inherit;font-size:0.85rem;cursor:pointer;
  }
  .btn-ghost:hover{border-color:var(--cream-dim);}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .add-song{margin:18px 0 8px;}
  .chip-select{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .chip{
    padding:8px 14px;border-radius:20px;border:1px solid var(--line);
    background:var(--bg-raised);color:var(--cream-dim);font-size:0.85rem;font-weight:500;
    cursor:pointer;transition:all .15s;
  }
  .chip.selected{background:var(--gtr);border-color:var(--gtr);color:#221B17;}
  .chip.universal::after{content:" ★";}
  .setlist-summary{font-size:0.85rem;color:var(--cream-dim);margin-bottom:14px;}
  .coverage-row{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;}
  .coverage-item{font-size:0.78rem;color:var(--cream-dim);}
  .coverage-item b{color:var(--cream);font-weight:600;}
  .missing{color:var(--drm);}
  details{margin-top:18px;}
  summary{cursor:pointer;color:var(--cream-dim);font-size:0.85rem;padding:6px 0;}
  select{
    background:var(--bg-raised);color:var(--cream);border:1px solid var(--line);
    border-radius:6px;padding:9px 12px;font-family:inherit;font-size:0.88rem;
  }
  .grid-table{width:100%;border-collapse:collapse;margin-top:14px;}
  .grid-table th{
    font-size:0.7rem;text-transform:none;color:var(--cream-dim);text-align:center;
    padding:6px 4px;font-weight:500;
  }
  .grid-table td{padding:8px 4px;border-top:1px solid var(--line);}
  .grid-song-name{font-size:0.85rem;padding-right:8px;}
  .grid-song-artist{color:var(--cream-dim);font-size:0.75rem;}
  .grid-artist-header{
    font-family:'Fraunces', serif;font-weight:600;font-size:0.92rem;color:var(--gtr);
    padding:14px 4px 6px;border-top:1px solid var(--line);
  }
  .grid-table tbody tr:first-child .grid-artist-header{border-top:none;padding-top:0;}
  .toggle-cell{text-align:center;}
  .toggle-btn{
    width:64px;height:34px;border-radius:6px;border:1px solid var(--line);
    background:transparent;cursor:pointer;font-size:0.62rem;font-weight:600;
    font-family:'IBM Plex Sans',sans-serif;color:var(--cream-dim);padding:0 4px;
  }
  .toggle-btn.on.gtr{background:var(--gtr);border-color:var(--gtr);color:#221B17;}
  .toggle-btn.on.bass{background:var(--bass);border-color:var(--bass);color:#101815;}
  .toggle-btn.on.drm{background:var(--drm);border-color:var(--drm);color:#221B17;}
  .toggle-btn.on.vox{background:var(--vox);border-color:var(--vox);color:#101418;}
  .loading{color:var(--cream-dim);font-size:0.9rem;padding:40px 0;text-align:center;}
  .add-musician-form{
    background:var(--bg-raised);border:1px solid var(--line);border-radius:8px;
    padding:14px 16px;margin-top:16px;display:none;gap:10px;flex-direction:column;
  }
  .add-musician-form.open{display:flex;}
  label.check{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--cream-dim);}
  .tag.keys{background:rgba(155,123,184,.16);color:var(--keys);}
  .tag.keys .dot{background:var(--keys);}
  .toggle-btn.on.keys{background:var(--keys);border-color:var(--keys);color:#1b1620;}

  /* ---------- Studio ---------- */
  .studio-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .who-chips{display:flex;gap:8px;}
  .who-chip{padding:10px 18px;border-radius:24px;border:1px solid var(--line);background:var(--bg-raised);color:var(--cream);font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;}
  .who-chip.selected{background:var(--gtr);border-color:var(--gtr);color:#221B17;}
  .who-big{display:flex;gap:14px;justify-content:center;margin:40px 0;}
  .who-big .who-chip{font-size:1.3rem;padding:22px 40px;border-radius:14px;}
  .level-box{min-width:200px;flex:1;max-width:320px;}
  .level-line{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;font-size:0.8rem;color:var(--cream-dim);margin-bottom:5px;}
  .level-line b{color:var(--cream);}
  .bar{height:8px;border-radius:6px;background:var(--bg-raised-2);overflow:hidden;}
  .bar > div{height:100%;background:linear-gradient(90deg,var(--gtr),#E8C46A);border-radius:6px;}
  .subtabs{display:flex;gap:6px;margin-bottom:16px;}
  .subtab{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:none;color:var(--cream-dim);font-family:inherit;font-size:0.85rem;cursor:pointer;}
  .subtab.active{background:var(--bg-raised-2);color:var(--cream);border-color:var(--cream-dim);}
  .step{background:var(--bg-raised);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
  .step.prio{border-color:var(--gtr);}
  .step-head{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .step-num{font-family:'IBM Plex Mono',monospace;font-size:0.75rem;color:var(--cream-dim);margin-right:6px;}
  .step-title{font-weight:600;}
  .step-min{font-size:0.8rem;color:var(--cream-dim);}
  .step-body{font-size:0.88rem;color:var(--cream-dim);line-height:1.55;margin-top:8px;}
  .step-song{font-family:'Fraunces',serif;font-size:1.15rem;color:var(--cream);margin-top:8px;}
  .objective{margin-top:8px;padding:9px 12px;border-radius:8px;background:var(--bg-raised-2);font-size:0.92rem;color:var(--cream);}
  .objective.missing-obj{color:var(--drm);border:1px dashed var(--drm);background:none;}
  .timer-btn{font-family:'IBM Plex Mono',monospace;font-size:0.9rem;min-width:92px;white-space:nowrap;}
  .timer-btn.running{background:var(--ok);color:#16200f;}
  .results{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .res-btn{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--cream-dim);font-family:inherit;font-size:0.85rem;cursor:pointer;}
  .res-btn.on{background:var(--cream);color:#221B17;border-color:var(--cream);font-weight:600;}
  .finish-bar{margin-top:16px;display:flex;justify-content:flex-end;}
  .btn:disabled{opacity:.4;cursor:default;filter:none;}
  .item-row{display:grid;grid-template-columns:1fr auto;gap:8px;background:var(--bg-raised);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .item-row .meta{font-size:0.75rem;color:var(--cream-dim);margin-top:3px;}
  .item-row input[type=text]{padding:8px 10px;font-size:0.85rem;margin-top:8px;grid-column:1 / -1;}
  .item-actions{display:flex;gap:6px;align-items:flex-start;}
  .item-actions select{padding:6px 8px;font-size:0.8rem;}
  .x-btn{background:none;border:none;color:var(--cream-dim);cursor:pointer;font-size:1rem;padding:4px 6px;}
  .section-label{font-size:0.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--cream-dim);margin:20px 0 8px;}
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .badge{background:var(--bg-raised);border:1px solid var(--line);border-radius:10px;padding:14px 10px;text-align:center;}
  .badge .ico{font-size:2rem;line-height:1;}
  .badge .bn{font-weight:600;font-size:0.88rem;margin-top:8px;}
  .badge .bd{font-size:0.75rem;color:var(--cream-dim);margin-top:4px;line-height:1.4;}
  .badge.locked{opacity:.38;}
  .badge.locked .ico{filter:grayscale(1);}
  .badge.earned{border-color:var(--gtr);}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px;}
  .stat{background:var(--bg-raised);border-radius:8px;padding:10px 12px;}
  .stat b{display:block;font-family:'Fraunces',serif;font-size:1.4rem;}
  .stat span{font-size:0.75rem;color:var(--cream-dim);}
  .toast-back{position:fixed;inset:0;background:rgba(10,8,6,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .toast{background:var(--bg-raised);border:1px solid var(--gtr);border-radius:14px;padding:24px;max-width:380px;width:100%;text-align:center;animation:pop .35s ease-out;}
  .toast h2{font-family:'Fraunces',serif;margin:0 0 6px;}
  .toast .xp{color:var(--gtr);font-weight:600;margin-bottom:14px;}
  .toast .badge{margin:8px 0;}
  .stars{color:var(--gtr);font-size:0.85rem;letter-spacing:2px;margin-top:4px;}
  .badge .count{color:var(--gtr);font-family:'IBM Plex Mono',monospace;font-size:0.8rem;}
  .challenge{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,rgba(217,164,65,.16),transparent);border:1px solid var(--gtr);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
  .challenge .ico{font-size:1.6rem;}
  .challenge .ct{font-weight:600;font-size:0.92rem;}
  .challenge .cs{font-size:0.78rem;color:var(--cream-dim);margin-top:2px;}
  .rec-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .rec-chip{padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:none;color:var(--cream-dim);font-family:inherit;font-size:0.82rem;cursor:pointer;}
  .rec-chip.on{background:var(--cream);color:#221B17;border-color:var(--cream);font-weight:600;}
  .rec-list{margin-top:10px;font-size:0.85rem;}
  .rec-list div{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>

import { getFirestore, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  messagingSenderId: "137937856334",
  appId: "1:137937856334:web:f759dfb5cfe5fa4834e01f"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

// Remplace le window.storage propre à l'environnement artifact Claude par un
// shim de même interface, adossé à Firestore — tout le reste du code de
// l'appli (safeGet/safeSet/queueSet, etc.) n'a besoin d'aucun changement.
// ?demo dans l'URL : stockage local au navigateur, pour tester sans toucher aux vraies données.
const DEMO = new URLSearchParams(location.search).has('demo');
window.storage = DEMO ? {
  async get(key){
    const v = localStorage.getItem('demo:'+key);
    if(v === null) throw new Error('not found');
    return {key, value: v};
  },
  async set(key, value){ localStorage.setItem('demo:'+key, value); return {key}; },
  async delete(key){ localStorage.removeItem('demo:'+key); return {key, deleted:true}; }
} : {
  async get(key){
    const snap = await getDoc(doc(db, 'app_data', key));
    if(!snap.exists()) throw new Error('not found');
    return {key, value: JSON.stringify(snap.data().value)};
  },
  async set(key, value){
    await setDoc(doc(db, 'app_data', key), {value: JSON.parse(value)});
    return {key};
  },
  async delete(key){
    await deleteDoc(doc(db, 'app_data', key));
    return {key, deleted:true};
  }
};

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }

async function safeGet(key, attempts=2){
  for(let i=0;i<attempts;i++){
    try{
      const res = await window.storage.get(key, true);
      return res ? JSON.parse(res.value) : null;
    }catch(e){
      if(i===attempts-1) return null;
      await sleep(400);
    }
  }
  return null;
}
async function safeSet(key, value, attempts=3){
  for(let i=0;i<attempts;i++){
    try{
      await window.storage.set(key, JSON.stringify(value), true);
      saveError = null;
      return true;
    }catch(e){
      if(i===attempts-1){
        saveError = `Échec de sauvegarde (${key}) — réessaie dans un instant.`;
        console.warn('storage set failed after retries', key);
        return false;
      }
      await sleep(500 * (i+1));
    }
  }
  return false;
}

// Sérialise les écritures par clé : si des clics rapides déclenchent plusieurs
// sauvegardes sur la même clé, on n'envoie que la dernière valeur, une à la fois,
// au lieu de laisser plusieurs requêtes concurrentes se battre sur la même clé.
const writeQueues = {};
function queueSet(key, value){
  let q = writeQueues[key];
  if(!q){ q = writeQueues[key] = {inFlight:false, hasPending:false, pendingValue:null}; }
  q.pendingValue = value;
  q.hasPending = true;
  processQueue(key);
}
async function processQueue(key){
  const q = writeQueues[key];
  if(!q || q.inFlight || !q.hasPending) return;
  const value = q.pendingValue;
  q.hasPending = false;
  q.inFlight = true;
  const ok = await safeSet(key, value);
  q.inFlight = false;
  if(!ok) render();
  if(q.hasPending) processQueue(key);
}

async function init(){
  let s = await safeGet('songs');
  if(!s){ s = SEED_SONGS; await safeSet('songs', s); }
  songs = s;

  let m = await safeGet('musicians');
  if(!m){ m = SEED_MUSICIANS; await safeSet('musicians', m); }
  else {
    const franck = m.find(mus => mus.id === 'franck');
    if(franck && !franck.universal){
      franck.universal = true;
      await safeSet('musicians', m);
    }
  }
  musicians = m;

  for(const mus of musicians){
    let data = await safeGet('mastery:'+mus.id);
    if(!data){
      data = mus.id==='seb' ? SEED_MASTERY_SEB : mus.id==='arthur' ? SEED_MASTERY_ARTHUR : {};
      await safeSet('mastery:'+mus.id, data);
    }
    mastery[mus.id] = data;
  }
  await loadProgress();
  if(location.hash === '#studio' || (studioWho && musicians.some(m=>m.id===studioWho))) activeTab = 'studio';
  render();
}

// Lecture stricte : distingue « n'existe pas » (on peut initialiser) d'une erreur réseau
// (on ne touche à rien, sinon on écraserait la progression existante).
async function strictGet(key){
  for(let i=0;i<3;i++){
    try{
      const res = await window.storage.get(key, true);
      return {ok:true, value: JSON.parse(res.value)};
    }catch(e){
      if(e && e.message === 'not found') return {ok:true, value:null};
      await sleep(500);
    }
  }
  return {ok:false, value:null};
}

function studioMusicians(){ return musicians.filter(m => !m.universal); }

async function loadProgress(){
  const missing = [];
  for(const m of studioMusicians()){
    const r = await strictGet('progress:'+m.id);
    if(!r.ok){ progressError = true; return; }
    if(r.value){ progress[m.id] = normalizeProgress(r.value); }
    else { progress[m.id] = emptyProgress(); missing.push(m.id); }
  }
  if(missing.includes('seb') && missing.includes('arthur')) await seedProgress();
  // Passage au nouveau système de badges : on marque l'existant comme déjà vu, sans redonner d'XP.
  for(const m of studioMusicians()){
    const p = progress[m.id];
    if(p && !p.seen){ p.seen = achievements(m.id); p.seenDates = {}; }
  }
}

function emptyProgress(){ return {items:{}, sessions:[], badges:{}, xp:0, dustCount:0, challenges:{}, seen:null, seenDates:{}}; }
function normalizeProgress(p){ return Object.assign(emptyProgress(), p, {items:p.items||{}, sessions:p.sessions||[], badges:p.badges||{}, challenges:p.challenges||{}}); }

function normTitle(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,''); }
function ensureSong(title, artist){
  let s = songs.find(x => normTitle(x.title) === normTitle(title));
  if(!s){
    s = {id: songs.length ? Math.max(...songs.map(x=>x.id))+1 : 1, title, artist};
    songs.push(s);
  }
  return s;
}

function computeSetlist(){
  const selected = musicians.filter(m => selectedForSetlist.has(m.id));
  const universalSelected = selected.filter(m=>m.universal);
  return songs.map(song => {
    const coverage = {};
    INSTRUMENTS.forEach(ins => {
      coverage[ins.key] = selected.filter(m=>!m.universal && (mastery[m.id][song.id]||[]).includes(ins.key)).map(m=>m.name);
    });
    const requiredGaps = REQUIRED.filter(r => coverage[r].length===0);
    const chantGap = coverage['Chant'].length===0;

    // Un backup universel ne peut jouer qu'un seul instrument à la fois par morceau.
    // Franck ne chante jamais : le backup universel ne couvre que les instruments requis, pas le chant.
    const universalPool = [...universalSelected];
    const backupLabel = {};
    requiredGaps.forEach(insKey => {
      if(universalPool.length) backupLabel[insKey] = universalPool.shift().name;
    });

    const missingRequired = requiredGaps.filter(insKey => !backupLabel[insKey]);
    const missingChant = chantGap;

    return {
      song, coverage, backupLabel,
      missingRequired, missingChant,
      playable: missingRequired.length===0,
      fullyComplete: missingRequired.length===0 && !missingChant,
    };
  }).sort((a,b)=>a.song.id-b.song.id);
}

function renderSetlist(){
  const chips = musicians.map(m => `<div class="chip ${selectedForSetlist.has(m.id)?'selected':''} ${m.universal?'universal':''}" data-musician="${m.id}">${escapeHtml(m.name)}</div>`).join('');
  const results = computeSetlist();
  const complete = results.filter(r=>r.fullyComplete);
  const missingSinger = results.filter(r=>r.playable && r.missingChant);
  const incomplete = results.filter(r=>!r.playable);

  const renderResult = r => {
    const covRow = REQUIRED.map(ins => {
      const names = r.coverage[ins];
      const label = names.length ? names.join(', ') : (r.backupLabel[ins] ? r.backupLabel[ins] + ' (backup)' : '—');
      return `<span class="coverage-item"><b>${ins}:</b> ${label}</span>`;
    }).join('');
    const voxNames = r.coverage['Chant'];
    let voxItem;
    if(voxNames.length) voxItem = `<span class="coverage-item"><b>Chant:</b> ${voxNames.join(', ')}</span>`;
    else voxItem = `<span class="coverage-item missing"><b>Chant:</b> —</span>`;
    if(r.coverage['Clavier'].length) voxItem += `<span class="coverage-item"><b>Clavier:</b> ${r.coverage['Clavier'].join(', ')}</span>`;
    return `<div class="song-card">
      <div class="song-top"><div><span class="song-num">#${r.song.id}</span> <span class="song-title">${escapeHtml(r.song.title)}</span> <span class="song-artist">— ${escapeHtml(r.song.artist)}</span></div></div>
      <div class="coverage-row">${covRow}${voxItem}</div>
    </div>`;
  };

  return `
    <p class="setlist-summary">Sélectionne les musiciens présents pour voir les morceaux jouables (guitare + basse + batterie couverts). ★ = backup universel sur les instruments (un seul à la fois par morceau) — ne chante pas.</p>
    <div class="chip-select">${chips}</div>

    <p class="setlist-summary"><b style="color:var(--cream)">${complete.length}</b> morceaux complets (chant inclus) sur ${songs.length}</p>
    ${complete.map(renderResult).join('') || '<p style="color:var(--cream-dim)">Aucun morceau complet avec cette sélection.</p>'}

    <p class="setlist-summary" style="margin-top:24px"><b style="color:var(--cream)">${missingSinger.length}</b> morceaux jouables mais sans chanteur</p>
    ${missingSinger.map(renderResult).join('') || '<p style="color:var(--cream-dim)">Aucun.</p>'}

    <details>
      <summary>${incomplete.length} morceaux incomplets avec ce groupe</summary>
      ${incomplete.map(r=>{
        const missingLabel = r.missingRequired.join(', ');
        return `<div class="song-card"><div class="song-top"><div><span class="song-num">#${r.song.id}</span> <span class="song-title">${escapeHtml(r.song.title)}</span></div></div><p class="missing" style="font-size:0.8rem;margin:8px 0 0">Manque : ${missingLabel}</p></div>`;
      }).join('')}
    </details>
  `;
}

function challengeProgress(mid){
  const wk = weekKey(todayStr()), ch = weekChallenge();
  const ws = (progress[mid]?.sessions||[]).filter(s => weekKey(s.date)===wk);
  return {ch, cur: Math.min(ch.cur(ws), ch.goal), done: !!(progress[mid]?.challenges||{})[wk]};
}

const LEVEL_TITLES = ['Débutant','Apprenti','Musicien de garage','Habitué des jams','Musicien de bar','Première partie','Tête d’affiche','Légende du studio'];
function levelTitle(L){ return LEVEL_TITLES[Math.min(L, LEVEL_TITLES.length)-1]; }

function todayStr(d=new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDay(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function daysBetween(a,b){ return Math.round((parseDay(b)-parseDay(a))/86400000); }
function weekKey(s){ const d=parseDay(s); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return todayStr(d); }
function songById(id){ return songs.find(s => String(s.id)===String(id)); }
function itemsOf(mid){ return Object.entries((progress[mid]||{}).items||{}).map(([key,it]) => ({key, ...it})).filter(it => songById(it.songId)); }
function wipSorted(mid){
  return itemsOf(mid).filter(i=>i.status==='wip')
    .sort((a,b)=>(a.lastWorked||'').localeCompare(b.lastWorked||'') || (a.createdAt||'').localeCompare(b.createdAt||'') || a.key.localeCompare(b.key));
}
function levelOf(xp){ let L=1; while(xp >= 25*L*(L+1)) L++; return L; }   // niveau 2 à 50 XP, 3 à 150, 4 à 300…
function levelFloor(L){ return 25*(L-1)*L; }

function uniqueDays(mid){ return [...new Set((progress[mid]?.sessions||[]).map(s=>s.date))].sort(); }
function maxStreak(days){
  let best=0, cur=0, prev=null;
  days.forEach(d => { cur = (prev && daysBetween(prev,d)===1) ? cur+1 : 1; best=Math.max(best,cur); prev=d; });
  return best;
}
function currentStreak(mid){
  const days = uniqueDays(mid); if(!days.length) return 0;
  const last = days[days.length-1]; const t = todayStr();
  if(daysBetween(last,t) > 1) return 0;
  let n=1; for(let i=days.length-1;i>0;i--){ if(daysBetween(days[i-1],days[i])===1) n++; else break; }
  return n;
}
function weekStreakMax(mid){
  const per = {};
  (progress[mid]?.sessions||[]).forEach(s => { const k=weekKey(s.date); per[k]=(per[k]||0)+1; });
  const weeks = Object.keys(per).filter(k=>per[k]>=2).sort();
  let best=0, cur=0, prev=null;
  weeks.forEach(w => { cur = (prev && daysBetween(prev,w)===7) ? cur+1 : 1; best=Math.max(best,cur); prev=w; });
  return best;
}
function stats(mid){
  const p = progress[mid] || emptyProgress();
  const results = p.sessions.flatMap(s=>s.items||[]);
  const perWeek = {};
  p.sessions.forEach(s => { const k=weekKey(s.date); perWeek[k]=(perWeek[k]||0)+1; });
  const days = uniqueDays(mid);
  const myDays = new Set(days);
  const otherDays = new Set(studioMusicians().filter(o=>o.id!==mid).flatMap(o=>(progress[o.id]?.sessions||[]).map(s=>s.date)));
  let comebacks = 0; for(let i=1;i<days.length;i++) if(daysBetween(days[i-1],days[i])>=7) comebacks++;
  const plan = p.sessions.filter(s=>s.followedPlan).length;
  return {
    sessions: p.sessions.length,
    reached: results.filter(r=>r.result==='reached').length,
    mastered: Object.values(p.items).filter(i=>i.status==='done' && i.masteredAt).length,
    streak: currentStreak(mid),
    maxStreak: maxStreak(days),
    maxWeekStreak: weekStreakMax(mid),
    instruments: new Set(results.map(r=>r.key.split('|')[1])).size,
    plan,
    planSets: Math.floor(plan/5),
    fullWeeks: Object.values(perWeek).filter(n=>n>=4).length,
    duoDays: [...myDays].filter(d=>otherDays.has(d)).length,
    dust: p.dustCount||0,
    comebacks,
    challenges: Object.keys(p.challenges||{}).length,
    ...recordStats(mid),
  };
}
// Instruments enregistrés par morceau, Seb et Arthur confondus : {songId: Set(instruments)}
function recordedBySong(){
  const map = {};
  studioMusicians().forEach(m => (progress[m.id]?.sessions||[]).forEach(se => (se.recordings||[]).forEach(r => {
    (map[r.songId] = map[r.songId] || new Set());
    r.ins.forEach(i => map[r.songId].add(i));
  })));
  return map;
}
function recordStats(mid){
  const mine = (progress[mid]?.sessions||[]).flatMap(se => se.recordings||[]);
  const mySongs = new Set(mine.map(r => String(r.songId)));
  const all = recordedBySong();
  const sizes = Object.entries(all).filter(([id]) => mySongs.has(String(id))).map(([,set]) => set.size);
  return {
    records: mine.reduce((n,r) => n + r.ins.length, 0),
    multitrack: Math.max(0, ...sizes),
    boxed: sizes.filter(n => n>=3).length,
  };
}
function U(t,n){ return n>1 ? t.unit[1] : t.unit[0]; }
function tierOf(value, steps){ return steps.filter(x => value>=x).length; }
function achievements(mid){
  const st = stats(mid);
  const wip = itemsOf(mid).filter(i=>i.status==='wip');
  const out = {};
  TIERED.forEach(t => out['t:'+t.id] = tierOf(st[t.stat], t.steps));
  REPEAT.forEach(r => out['r:'+r.id] = st[r.stat]);
  out['o:precise'] = (wip.length>=2 && wip.every(i => (i.objective||'').trim().length>=8)) ? 1 : 0;
  return out;
}
// Prochain palier le plus proche, pour encourager.
function nextGoal(mid){
  const st = stats(mid); let best = null;
  TIERED.forEach(t => {
    const tier = tierOf(st[t.stat], t.steps); if(tier>=t.steps.length) return;
    const target = t.steps[tier], left = target - st[t.stat];
    const ratio = left / target;
    if(!best || ratio < best.ratio) best = {ratio, text:`${t.ico} ${t.name} : plus que ${left} pour atteindre ${target} ${U(t,target)}`};
  });
  return best ? best.text : null;
}

// Compare les succès actuels à ceux déjà vus, attribue les XP et renvoie les nouveautés (avec .xp).
function checkBadges(mid){
  const p = progress[mid]; const fresh = []; fresh.xp = 0;
  if(!p) return fresh;
  const a = achievements(mid), today = todayStr();
  p.seen = p.seen || {}; p.seenDates = p.seenDates || {};
  TIERED.forEach(t => {
    const k='t:'+t.id, n=a[k], old=p.seen[k]||0;
    if(n>old){
      for(let i=old+1;i<=n;i++) fresh.xp += XP.tier*i;
      fresh.push({ico:t.ico, name:`${t.name} ${'★'.repeat(n)}`, desc:`${t.steps[n-1]} ${U(t,t.steps[n-1])}`});
      p.seen[k]=n; p.seenDates[k]=today;
    }
  });
  REPEAT.forEach(r => {
    const k='r:'+r.id, n=a[k], old=p.seen[k]||0;
    if(n>old){
      fresh.xp += r.xp*(n-old);
      fresh.push({ico:r.ico, name: n>1 ? `${r.name} ×${n}` : r.name, desc:r.desc});
      p.seen[k]=n; p.seenDates[k]=today;
    }
  });
  ONCE.forEach(o => {
    const k='o:'+o.id;
    if(a[k] && !p.seen[k]){ fresh.xp += XP.once; fresh.push({ico:o.ico, name:o.name, desc:o.desc}); p.seen[k]=1; p.seenDates[k]=today; }
  });
  p.xp = (p.xp||0) + fresh.xp;
  return fresh;
}

function saveProgress(mid){ if(!progressError && progress[mid]) queueSet('progress:'+mid, progress[mid]); }
function saveSession(){ lsSet('setlistas-session', session ? JSON.stringify(session) : null); }

// Séance du jour : créée au premier geste (minuteur, résultat, changement de priorité).
function currentSession(){
  if(session && (session.who!==studioWho || session.date!==todayStr())){ session=null; saveSession(); }
  return session;
}
function ensureSession(plan){
  if(!currentSession()){
    session = {who:studioWho, date:todayStr(), proposedKey:plan.proposed?.key||null, priorityKey:null, swapped:false, results:{}, mastered:{}, newObjectives:{}};
  }
  return session;
}

function buildPlan(mid){
  const wip = wipSorted(mid);
  const s = currentSession();
  const proposed = wip[0] || null;
  let priority = proposed;
  if(s && s.priorityKey){ priority = wip.find(i=>i.key===s.priorityKey) || proposed; }
  // De préférence un autre morceau que la priorité (pas la même chanson à un autre instrument).
  const second = (priority && (wip.find(i => i.songId!==priority.songId) || wip.find(i => i.key!==priority.key))) || null;
  // Sans deuxième morceau en cours : on repasse un morceau du répertoire, choisi selon le jour.
  let review = null;
  if(!second){
    const known = Object.entries(mastery[mid]||{}).filter(([id,ins]) => ins && ins.length && songById(id));
    if(known.length){
      const t = todayStr(); let h=0; for(const c of t) h=(h*31+c.charCodeAt(0))%9973;
      const [id,ins] = known[h % known.length];
      review = {song: songById(id), ins: ins[0]};
    }
  }
  return {wip, proposed, priority, second, review};
}

function insTag(ins){ return `<span class="tag ${INS_CLS[ins]||''}"><span class="dot"></span>${escapeHtml(ins)}</span>`; }
function fmtTime(sec){ sec=Math.max(0,Math.ceil(sec)); return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); }
function timerLabel(stepId, minutes){
  if(timer.step===stepId){
    const rem = timer.endAt ? (timer.endAt-Date.now())/1000 : timer.remaining;
    return (timer.endAt ? '⏸ ' : '▶ ') + fmtTime(rem);
  }
  return '▶ ' + minutes + ' min';
}
function sinceLabel(d){
  if(!d) return 'jamais travaillé ici';
  const n = daysBetween(d, todayStr());
  return n===0 ? "travaillé aujourd'hui" : n===1 ? 'travaillé hier' : `travaillé il y a ${n} jours`;
}

function renderStudio(){
  if(progressError) return `<div class="note" style="border-color:var(--drm);color:var(--drm)">Impossible de charger la progression. Recharge la page (rien n'a été modifié).</div>`;
  const people = studioMusicians();
  if(!studioWho || !people.some(m=>m.id===studioWho)){
    return `<p style="text-align:center;font-family:'Fraunces',serif;font-size:1.4rem;margin-top:30px">Qui joue ?</p>
      <div class="who-big">${people.map(m=>`<button class="who-chip" data-who="${m.id}">${escapeHtml(m.name)}</button>`).join('')}</div>`;
  }
  if(!progress[studioWho]) progress[studioWho] = emptyProgress();
  const p = progress[studioWho];
  const L = levelOf(p.xp||0), lo = levelFloor(L), hi = levelFloor(L+1);
  const pct = Math.round(100*((p.xp||0)-lo)/(hi-lo));
  const streak = currentStreak(studioWho);
  const head = `<div class="studio-head">
      <div class="who-chips">${people.map(m=>`<button class="who-chip ${m.id===studioWho?'selected':''}" data-who="${m.id}">${escapeHtml(m.name)}</button>`).join('')}</div>
      <div class="level-box">
        <div class="level-line"><span><b>Niveau ${L}</b> · ${levelTitle(L)} · ${p.xp||0} XP</span><span>${streak?`🔥 ${streak} j · `:''}${Object.values(p.seen||{}).filter(v=>v>0).length}/${ALL_BADGES_COUNT} badges</span></div>
        <div class="bar"><div style="width:${pct}%"></div></div>
      </div>
    </div>
    <div class="subtabs">
      <button class="subtab ${studioView==='seance'?'active':''}" data-sv="seance">Séance du jour</button>
      <button class="subtab ${studioView==='morceaux'?'active':''}" data-sv="morceaux">Mes morceaux</button>
      <button class="subtab ${studioView==='badges'?'active':''}" data-sv="badges">Badges</button>
    </div>`;
  const body = studioView==='morceaux' ? renderMyItems() : studioView==='badges' ? renderBadges() : renderSeance();
  return head + body;
}

function renderSeance(){
  const plan = buildPlan(studioWho);
  const s = currentSession();
  if(!plan.priority){
    return `<div class="note">Aucun morceau en cours. Va dans <b>Mes morceaux</b> pour en passer un « en cours » et lui donner un objectif.</div>`;
  }
  const lastToday = (progress[studioWho].sessions||[]).filter(x=>x.date===todayStr()).length;
  const resultBtns = (it) => {
    const r = s?.results?.[it.key];
    let extra = '';
    if(r==='reached'){
      extra = `<label class="check" style="margin-top:10px"><input type="checkbox" class="master-cb" data-key="${it.key}" ${s.mastered[it.key]?'checked':''}> Je le maîtrise : passer en « maîtrisé » 🏆</label>
        ${s.mastered[it.key] ? '' : `<input type="text" class="newobj-input" data-key="${it.key}" placeholder="Prochain objectif (ex. le pont, à 100 % du tempo)" value="${escapeAttr(s.newObjectives[it.key]||'')}" style="margin-top:8px">`}`;
    }
    return `<div class="results">
        <button class="res-btn ${r==='reached'?'on':''}" data-res="reached" data-key="${it.key}">🎯 Objectif atteint</button>
        <button class="res-btn ${r==='progress'?'on':''}" data-res="progress" data-key="${it.key}">📈 Ça avance</button>
        <button class="res-btn ${r==='skip'?'on':''}" data-res="skip" data-key="${it.key}">Pas travaillé</button>
      </div>${extra}`;
  };
  const objBox = (it) => (it.objective||'').trim()
    ? `<div class="objective">🎯 ${escapeHtml(it.objective)}</div>`
    : `<div class="objective missing-obj">Pas d'objectif écrit. Choisis-en un précis avant de jouer (un passage, un tempo), et note-le dans « Mes morceaux ».</div>`;
  const pr = plan.priority, song = songById(pr.songId);
  const swapSel = swapOpen && plan.wip.length>1 ? `<select id="swap-select" style="margin-top:10px">${plan.wip.map(i=>`<option value="${i.key}" ${i.key===pr.key?'selected':''}>${escapeHtml(songById(i.songId).title)} · ${i.ins}</option>`).join('')}</select>` : '';
  const step = (n, id, min, title, inner, cls='') => `<div class="step ${cls}">
      <div class="step-head"><div><span class="step-num">${n}</span><span class="step-title">${title}</span></div>
        ${min ? `<button class="btn-ghost timer-btn ${timer.step===id&&timer.endAt?'running':''}" data-timer="${id}" data-min="${min}" id="timer-${id}">${timerLabel(id,min)}</button>` : ''}</div>
      ${inner}</div>`;

  let secondInner;
  if(plan.second){
    const s2 = songById(plan.second.songId);
    secondInner = `<div class="step-song">${escapeHtml(s2.title)} <span class="song-artist">— ${escapeHtml(s2.artist)}</span> ${insTag(plan.second.ins)}</div>
      ${objBox(plan.second)}
      <div class="step-body">Joue-le en entier avec le backing Moises à vitesse normale. Repère l'endroit où ça casse : ce sera peut-être ton prochain objectif. <i>${sinceLabel(plan.second.lastWorked)}</i></div>
      ${resultBtns(plan.second)}`;
  } else if(plan.review){
    secondInner = `<div class="step-song">${escapeHtml(plan.review.song.title)} <span class="song-artist">— ${escapeHtml(plan.review.song.artist)}</span> ${insTag(plan.review.ins)}</div>
      <div class="step-body">Un morceau que tu connais déjà, en entier sur le backing, pour l'entretenir.</div>`;
  } else {
    secondInner = `<div class="step-body">Repasse un morceau que tu connais déjà, en entier sur le backing.</div>`;
  }

  const canFinish = s && (Object.values(s.results).some(r=>r==='reached'||r==='progress') || (s.recordings||[]).length);
  const cp = challengeProgress(studioWho);
  const challengeCard = `<div class="challenge"><div class="ico">⭐</div><div style="flex:1">
      <div class="ct">Défi de la semaine : ${cp.ch.text}</div>
      <div class="cs">${cp.done ? 'Relevé ✓ · nouveau défi lundi' : `${cp.cur} / ${cp.ch.goal} · +40 XP à la clé`}</div>
      ${cp.done ? '' : `<div class="bar" style="margin-top:6px;height:5px"><div style="width:${Math.round(100*cp.cur/cp.ch.goal)}%"></div></div>`}
    </div></div>`;
  const recSong = recDraft.songId ?? pr.songId;
  const allRec = recordedBySong();
  (s?.recordings||[]).forEach(r => { allRec[r.songId] = new Set([...(allRec[r.songId]||[]), ...r.ins]); });
  const already = allRec[recSong] ? [...allRec[recSong]] : [];
  const collator2 = new Intl.Collator('fr',{sensitivity:'base'});
  const recInner = `<div class="step-body">Enregistre-toi sur le backing (GarageBand ou le téléphone), puis indique-le ici. Chaque nouvel instrument sur un même morceau multiplie les points : ×2 pour le 2e, ×3 pour le 3e… À deux, ça compte aussi.</div>
      <div class="row" style="margin-top:10px">
        <select id="rec-song" style="flex:1;min-width:180px">${[...songs].sort((a,b)=>collator2.compare(a.title,b.title)).map(x=>`<option value="${x.id}" ${String(x.id)===String(recSong)?'selected':''}>${escapeHtml(x.title)}</option>`).join('')}</select>
      </div>
      ${already.length ? `<div class="step-body" style="margin-top:6px">Déjà enregistré sur ce morceau : ${already.map(i=>escapeHtml(i)).join(', ')}. Prochain instrument : ×${already.length+1}.</div>` : ''}
      <div class="rec-chips">${INSTRUMENTS.map(i=>`<button class="rec-chip ${recDraft.ins.includes(i.key)?'on':''}" data-recins="${i.key}">${i.key}</button>`).join('')}</div>
      <div style="margin-top:10px"><button class="btn-ghost" id="rec-add" ${recDraft.ins.length?'':'disabled'}>🎙️ J'ai enregistré ça</button></div>
      ${(s?.recordings||[]).length ? `<div class="rec-list">${s.recordings.map((r,idx)=>`<div><span>🎙️ ${escapeHtml(songById(r.songId)?.title||'?')} · ${r.ins.join(' + ')}</span><button class="x-btn" data-recdel="${idx}">✕</button></div>`).join('')}</div>` : ''}`;
  return `
    ${challengeCard}
    ${lastToday ? `<div class="note">Déjà ${lastToday} séance${lastToday>1?'s':''} terminée${lastToday>1?'s':''} aujourd'hui. Tu peux en refaire une.</div>` : ''}
    ${step(1,'warm',5,'Échauffement',`<div class="step-body">${WARMUP[pr.ins]||WARMUP.Guitare}</div>`)}
    ${step(2,'prio',15,'Objectif prioritaire',`
      <div class="step-song">${escapeHtml(song.title)} <span class="song-artist">— ${escapeHtml(song.artist)}</span> ${insTag(pr.ins)}</div>
      ${objBox(pr)}
      <div class="step-body">${METHOD[pr.ins]||METHOD.Guitare} <i>${sinceLabel(pr.lastWorked)}.</i>
        ${plan.wip.length>1 ? `<a href="#" id="swap-link" style="color:var(--cream-dim);margin-left:4px">Changer de priorité</a>` : ''}</div>
      ${swapSel}
      ${resultBtns(pr)}`,'prio')}
    ${step(3,'second',7, plan.second ? 'Deuxième morceau en cours' : 'Morceau du répertoire', secondInner)}
    ${step('★','rec',0,'🎙️ Enregistrement (bonus)', recInner)}
    ${step(4,'free',0,'Jeu libre 🎸',`<div class="step-body">Joue ce que tu veux : c'est la récompense. Mais d'abord, clique sur « Terminer la séance » pour gagner tes points.</div>`)}
    <div class="finish-bar"><button class="btn" id="finish-session" ${canFinish?'':'disabled'}>Terminer la séance</button></div>
    ${canFinish ? '' : `<p style="font-size:0.78rem;color:var(--cream-dim);text-align:right;margin-top:6px">Indique au moins un « Objectif atteint », un « Ça avance » ou un enregistrement pour terminer.</p>`}
  `;
}

function addMastery(mid, songId, ins){
  const cur = mastery[mid][songId] || mastery[mid][String(songId)] || [];
  if(!cur.includes(ins)){ cur.push(ins); mastery[mid][String(songId)] = cur; queueSet('mastery:'+mid, mastery[mid]); }
}

function finishSession(){
  const s = currentSession(); if(!s) return;
  const who = s.who, p = progress[who], today = todayStr();
  const worked = Object.entries(s.results).filter(([k,r]) => (r==='reached'||r==='progress') && p.items[k]);
  const recs = (s.recordings||[]).filter(r => songById(r.songId) && r.ins.length);
  if(!worked.length && !recs.length) return;
  const xpBefore = p.xp||0, levelBefore = levelOf(xpBefore);
  const prevDays = uniqueDays(who).filter(d => d!==today);
  const comeback = prevDays.length && daysBetween(prevDays[prevDays.length-1], today) >= 7;
  let xp = XP.session;
  // Enregistrements : multiplicateur = nombre d'instruments réunis sur le morceau (Seb + Arthur).
  const known = recordedBySong();
  let bestMult = 1;
  recs.forEach(r => {
    const set = new Set(known[r.songId] || []);
    r.ins.forEach(i => {
      if(set.has(i)){ xp += XP.record; }
      else { set.add(i); xp += XP.record * set.size; bestMult = Math.max(bestMult, set.size); }
    });
    known[r.songId] = set;
  });
  worked.forEach(([k,r]) => {
    const it = p.items[k];
    if(it.lastWorked && daysBetween(it.lastWorked, today) >= 14) p.dustCount = (p.dustCount||0)+1;
    it.lastWorked = today;
    it.workedCount = (it.workedCount||0)+1;
    if(r==='reached'){
      xp += XP.reached;
      it.reachedCount = (it.reachedCount||0)+1;
      it.lastReached = it.objective || '';
      if(s.mastered[k]){
        it.status = 'done'; it.masteredAt = today; xp += XP.mastered;
        addMastery(who, it.songId, it.ins);
      } else {
        it.objective = (s.newObjectives[k]||'').trim();
      }
    } else xp += XP.progress;
  });
  p.sessions.push({
    date: today, ts: new Date().toISOString(),
    items: worked.map(([k,r]) => ({key:k, result:r})),
    followedPlan: !s.swapped && !!s.proposedKey && worked.some(([k]) => k===s.proposedKey),
    recordings: recs.map(r => ({songId:r.songId, ins:[...r.ins]})),
  });
  p.xp = xpBefore + xp;
  // Défi de la semaine
  const cp = challengeProgress(who);
  if(!cp.done && cp.cur >= cp.ch.goal){ p.challenges = p.challenges || {}; p.challenges[weekKey(today)] = today; }
  const fresh = checkBadges(who);
  // Le badge Duo peut aussi se débloquer pour l'autre.
  studioMusicians().forEach(m => { if(m.id!==who){ const f = checkBadges(m.id); if(f.length) saveProgress(m.id); } });
  saveProgress(who);
  const levelAfter = levelOf(p.xp);
  const msgs = [];
  if(comeback) msgs.push('Content de te revoir au studio !');
  if(bestMult > 1) msgs.push(`🎚️ Multiplicateur ×${bestMult} sur l'enregistrement.`);
  if(cp.done === false && (p.challenges||{})[weekKey(today)]) msgs.push('⭐ Défi de la semaine relevé !');
  else if(!(p.challenges||{})[weekKey(today)]) msgs.push(`Défi de la semaine : ${cp.ch.text} (${challengeProgress(who).cur}/${cp.ch.goal}).`);
  toast = {title: comeback ? 'Content de te revoir !' : fresh.length ? 'Bravo !' : 'Bien joué !', msg: msgs.join(' '), xp: p.xp - xpBefore, badges: fresh, next: nextGoal(who),
    levelUp: levelAfter>levelBefore ? `${levelAfter} · ${levelTitle(levelAfter)}` : null, cta:'Place au jeu libre 🎸'};
  session = null; saveSession();
  stopTimer();
  render();
}

function stopTimer(){ timer = {step:null, endAt:null, remaining:null}; if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(t => { const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=880; g.gain.value=0.15; o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.2); });
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
  }catch(e){}
}
function tick(){
  if(!timer.step || !timer.endAt) return;
  const rem = (timer.endAt - Date.now())/1000;
  const el = document.getElementById('timer-'+timer.step);
  if(rem <= 0){ beep(); const id=timer.step; stopTimer(); const e2=document.getElementById('timer-'+id); if(e2){ e2.textContent='✓ terminé'; e2.classList.remove('running'); } return; }
  if(el) el.textContent = '⏸ ' + fmtTime(rem);
}

function csvEscape(val){
  const s = String(val ?? '');
  if(/[;"\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function exportCSV(){
  const header = ['N°','Titre','Artiste', ...musicians.map(m => m.universal ? m.name+' (backup universel)' : m.name)];
  const rows = songs.map(song => {
    const row = [song.id, song.title, song.artist];
    musicians.forEach(m => {
      if(m.universal) row.push('backup — tous instruments');
      else row.push((mastery[m.id][song.id]||[]).join(' + '));
    });
    return row;
  });
  const lines = [header, ...rows].map(r => r.map(csvEscape).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF' + lines], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'repertoire.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function parseCSVLine(line){
  const fields = [];
  let cur = '', inQuotes = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = false;
      } else cur += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ';'){ fields.push(cur); cur=''; }
      else cur += ch;
    }
  }
  fields.push(cur);
  return fields;
}

function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  return text.split(/\r\n|\n|\r/).filter(l => l.trim().length).map(parseCSVLine);
}

function handleImportFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const rows = parseCSV(e.target.result);
      if(rows.length < 2) throw new Error('fichier vide ou format inattendu');
      const header = rows[0];
      const musicianCols = header.slice(3);
      if(musicianCols.length === 0) throw new Error('aucune colonne musicien trouvée');

      const seenIds = {};
      const newMusicians = musicianCols.map(h => {
        const universal = /\(backup universel\)/i.test(h);
        const name = h.replace(/\s*\(backup universel\)\s*/i, '').trim() || 'musicien';
        let id = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'') || 'musicien';
        if(seenIds[id]){ seenIds[id]++; id = id + seenIds[id]; } else seenIds[id] = 1;
        return {id, name, universal};
      });

      const newSongs = [];
      const newMastery = {};
      newMusicians.forEach(m => { newMastery[m.id] = {}; });

      rows.slice(1).forEach((r, idx) => {
        const title = (r[1]||'').trim();
        if(!title) return;
        const parsedId = parseInt(r[0], 10);
        const id = Number.isFinite(parsedId) ? parsedId : (idx+1);
        const artist = (r[2]||'').trim();
        newSongs.push({id, title, artist});
        newMusicians.forEach((m, ci) => {
          if(m.universal) return;
          const cell = (r[3+ci]||'').trim();
          if(!cell) return;
          const instruments = cell.split('+').map(s=>s.trim()).filter(s => INSTRUMENTS.some(i=>i.key===s));
          if(instruments.length) newMastery[m.id][id] = instruments;
        });
      });

      if(newSongs.length === 0) throw new Error('aucun morceau reconnu dans le fichier');

      importError = null;
      importCodeError = null;
      pendingImport = {musicians:newMusicians, songs:newSongs, mastery:newMastery};
      render();
    }catch(err){
      importError = 'Fichier illisible (' + err.message + ').';
      pendingImport = null;
      render();
    }
  };
  reader.onerror = () => { importError = 'Impossible de lire le fichier.'; render(); };
  reader.readAsText(file, 'UTF-8');
}

    renderPartial();
    safeSet('songs', songs).then(ok => { if(!ok) renderPartial(); });
  };

  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const id = c.dataset.musician;
    if(selectedForSetlist.has(id)) selectedForSetlist.delete(id); else selectedForSetlist.add(id);
    render();
  });

  const musicianSelect = document.getElementById('musician-select');
  if(musicianSelect) musicianSelect.onchange = (e) => { selectedGridMusician = e.target.value || null; render(); };

  const newMusicianBtn = document.getElementById('new-musician-btn');
  if(newMusicianBtn) newMusicianBtn.onclick = () => {
    document.getElementById('new-musician-form').classList.toggle('open');
  };

  const confirmBtn = document.getElementById('confirm-new-musician');
  if(confirmBtn) confirmBtn.onclick = async () => {
    const nameInput = document.getElementById('new-musician-name');
    const name = nameInput.value.trim();
    if(!name) return;
    let id = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'') || 'musicien';
    if(musicians.some(m=>m.id===id)) id = id + Math.floor(Math.random()*1000);
    const newMusician = {id, name};
    musicians.push(newMusician);
    mastery[id] = {};
    selectedGridMusician = id;
    render();
    const ok = await safeSet('musicians', musicians);
    if(!ok) render();
    await safeSet('mastery:'+id, {});
  };

  const deleteBtn = document.getElementById('delete-musician-btn');
  if(deleteBtn) deleteBtn.onclick = () => { pendingDeleteMusician = selectedGridMusician; deleteCodeError = null; render(); };

  const cancelDeleteBtn = document.getElementById('cancel-delete-musician');
  if(cancelDeleteBtn) cancelDeleteBtn.onclick = () => { pendingDeleteMusician = null; deleteCodeError = null; render(); };

  const confirmDeleteBtn = document.getElementById('confirm-delete-musician');
  if(confirmDeleteBtn) confirmDeleteBtn.onclick = () => {
    const codeInput = document.getElementById('delete-code-input');
    if(!codeInput || codeInput.value.trim() !== '2206'){
      deleteCodeError = 'Code incorrect.';
      render();
      return;
    }
    const id = pendingDeleteMusician;
    musicians = musicians.filter(m=>m.id!==id);
    delete mastery[id];
    selectedForSetlist.delete(id);
    selectedGridMusician = null;
    pendingDeleteMusician = null;
    deleteCodeError = null;
    render();
    safeSet('musicians', musicians).then(ok => { if(!ok) render(); });
    window.storage.delete('mastery:'+id, true).catch(()=>{});
  };

  document.querySelectorAll('.toggle-btn').forEach(btn => btn.onclick = () => {
    if(!selectedGridMusician) return;
    const songId = btn.dataset.song;
    const ins = btn.dataset.ins;
    const current = mastery[selectedGridMusician][songId] || [];
    const idx = current.indexOf(ins);
    if(idx>=0) current.splice(idx,1); else current.push(ins);
    mastery[selectedGridMusician][songId] = current;
    render();
    queueSet('mastery:'+selectedGridMusician, mastery[selectedGridMusician]);
  });
}

function renderPartial(focusSearch){
  document.getElementById('tab-content').innerHTML = renderRepertoire();
  attachEvents();
  if(focusSearch){
    const s = document.getElementById('search');
    const val = s.value;
    s.focus();
    s.selectionStart = s.selectionEnd = val.length;
  }
}

init();
</script>
</body>
</html>
