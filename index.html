<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SetlistAS</title>
<meta name="theme-color" content="#1E2421">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SetlistAS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  /* Console de studio : panneaux gris-vert, sérigraphie claire, vumètre ivoire,
     et une couleur de capuchon de fader par instrument. */
  :root{
    --console:#1E2421;
    --panel:#2A312D;
    --panel-2:#343C37;
    --rule:#46504A;
    --ink:#ECE8DC;
    --ink-dim:#A7AEA5;
    --ivory:#EFE4B8;
    --ivory-ink:#2B2A22;
    --amber:#F0A43A;
    --amber-ink:#2A1C06;
    --red:#E04A3C;
    --ok:#7FBF7A;
    /* capuchons de fader */
    --gtr:#E9C54A;
    --bass:#4FAE8D;
    --drm:#E0574C;
    --keys:#A08BDB;
    --vox:#62A2DB;
    --r-s:5px; --r-m:9px; --r-l:14px;
    --font:'Archivo', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--console);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;}
  button,input,select,textarea{font:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  a{color:var(--amber);}
  .grow{flex:1;}
  [hidden]{display:none !important;}

  /* ---------- Barre du haut ---------- */
  .appbar{position:sticky;top:0;z-index:20;background:rgba(30,36,33,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);
    display:flex;align-items:center;gap:20px;padding:0 max(16px, calc((100vw - 860px)/2));}
  .brand{font-stretch:75%;font-weight:800;font-size:1.25rem;letter-spacing:.01em;padding:12px 0;white-space:nowrap;}
  .brand small{font-weight:500;font-stretch:100%;font-size:.7rem;color:var(--amber);margin-left:4px;}
  .tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--ink-dim);padding:14px 12px 11px;cursor:pointer;white-space:nowrap;font-weight:500;}
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--ink);border-bottom-color:var(--amber);}
  .page{max-width:860px;margin:0 auto;padding:24px 16px 80px;}
  .loading{padding:60px 20px;text-align:center;color:var(--ink-dim);}

  /* ---------- Typo ---------- */
  h1,h2,h3{font-stretch:80%;font-weight:700;line-height:1.15;margin:0;}
  .section-title{font-size:1.35rem;margin:32px 0 12px;}
  .group-title{font-size:1.05rem;margin:24px 0 10px;color:var(--ink);}
  .lede{color:var(--ink-dim);max-width:62ch;margin:0 0 16px;}
  .hint{color:var(--ink-dim);font-size:.85rem;margin:8px 0;}
  .empty{color:var(--ink-dim);font-size:.92rem;}
  .meta-line{color:var(--ink-dim);font-size:.9rem;}
  .small{font-size:.85rem;}
  .warn-text{color:var(--red);}
  .danger-text{color:var(--red) !important;border-color:var(--red) !important;}

  /* ---------- Contrôles ---------- */
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .btn{background:var(--amber);color:var(--amber-ink);border:0;border-radius:var(--r-s);padding:10px 16px;font-weight:700;cursor:pointer;}
  .btn:hover{filter:brightness(1.07);}
  .btn.big{padding:14px 22px;font-size:1.05rem;}
  .btn.danger{background:var(--red);color:#fff;}
  .btn:disabled,.btn-ghost:disabled{opacity:.4;cursor:default;filter:none;}
  .btn-ghost{background:none;border:1px solid var(--rule);color:var(--ink);border-radius:var(--r-s);padding:9px 14px;cursor:pointer;}
  .btn-ghost:hover{border-color:var(--ink-dim);}
  .btn-ghost.small{padding:6px 10px;font-size:.85rem;}
  .link-btn{background:none;border:0;padding:0;color:var(--amber);cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
  .icon-btn,.x-btn{background:none;border:1px solid transparent;color:var(--ink-dim);border-radius:var(--r-s);width:34px;height:34px;cursor:pointer;flex:none;}
  .icon-btn:hover,.x-btn:hover{border-color:var(--rule);color:var(--ink);}
  .icon-btn:disabled{opacity:.3;}
  input[type=text],input[type=password],input[type=number],input[type=url],input[type=date],input:not([type]),select,.search{
    background:var(--console);border:1px solid var(--rule);border-radius:var(--r-s);padding:9px 11px;color:var(--ink);min-width:0;}
  input::placeholder{color:#7E867E;}
  .search{width:100%;font-size:1rem;padding:12px 14px;}
  .field{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .field > span{font-size:.8rem;color:var(--ink-dim);}
  .field.inline{flex-direction:row;align-items:center;gap:10px;}
  .field.inline input{width:90px;}
  .check{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--ink);cursor:pointer;}
  .check input{width:18px;height:18px;accent-color:var(--amber);}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px;}
  .form-grid .wide{grid-column:1 / -1;}
  .note{background:var(--panel);border-left:3px solid var(--amber);border-radius:var(--r-s);padding:12px 14px;margin:0 0 16px;color:var(--ink);}
  .note.warn{border-left-color:var(--red);}
  details{margin:20px 0;}
  summary{cursor:pointer;color:var(--ink-dim);}
  .error{color:var(--red);margin:10px 0 0;}

  /* ---------- Capuchons d'instrument ---------- */
  .tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:var(--r-s);background:var(--panel-2);font-size:.8rem;font-weight:600;white-space:nowrap;}
  .tag .dot{width:9px;height:14px;border-radius:2px;background:var(--ink-dim);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);}
  .tag.gtr .dot{background:var(--gtr);} .tag.bass .dot{background:var(--bass);} .tag.drm .dot{background:var(--drm);} .tag.keys .dot{background:var(--keys);} .tag.vox .dot{background:var(--vox);}
  .tag .names{font-weight:400;color:var(--ink-dim);}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .tag-empty{color:var(--ink-dim);font-size:.85rem;}

  /* ---------- Fiches morceaux ---------- */
  .song-card{background:var(--panel);border-radius:var(--r-m);padding:12px 14px;margin-bottom:8px;}
  .song-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .song-title{font-weight:700;}
  .song-artist{color:var(--ink-dim);}
  .song-extra{color:var(--ink-dim);font-size:.85rem;margin-left:6px;}
  .artist-header{font-stretch:80%;font-weight:700;font-size:1.1rem;color:var(--ink-dim);margin:22px 0 8px;}
  .links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:.88rem;align-items:center;}
  .links .ext{color:var(--amber);text-decoration:none;border-bottom:1px solid rgba(240,164,58,.4);}
  .song-key{color:var(--ink-dim);}
  .song-edit .row{margin-top:4px;}
  .coverage-row{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:.88rem;color:var(--ink-dim);}
  .coverage-item b{color:var(--ink);font-weight:600;margin-right:4px;}
  .coverage-item.missing{color:var(--red);}
  .coverage-item.backup{color:var(--amber);}

  /* ---------- Sélection de musiciens ---------- */
  .chip-select{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px;}
  .chip{padding:8px 16px;border-radius:999px;border:1px solid var(--rule);cursor:pointer;color:var(--ink-dim);user-select:none;}
  .chip.selected{background:var(--ink);color:var(--console);border-color:var(--ink);font-weight:600;}
  .chip.universal::after{content:' (backup)';font-size:.8em;opacity:.8;}

  /* ---------- Grille ---------- */
  .grid-table{width:100%;border-collapse:collapse;margin-top:16px;}
  .grid-table th{font-size:.78rem;color:var(--ink-dim);font-weight:500;padding:6px 2px;position:sticky;top:50px;background:var(--console);}
  .grid-song-name{padding:6px 8px 6px 0;font-size:.92rem;}
  .grid-artist-header{padding:18px 0 6px;font-stretch:80%;font-weight:700;color:var(--ink-dim);}
  .toggle-cell{text-align:center;padding:3px;}
  .toggle-btn{width:100%;min-width:52px;padding:7px 4px;border-radius:var(--r-s);border:1px solid var(--rule);background:none;color:var(--ink-dim);font-size:.75rem;cursor:pointer;}
  .toggle-btn.on{color:#14130f;font-weight:700;border-color:transparent;}
  .toggle-btn.on.gtr{background:var(--gtr);} .toggle-btn.on.bass{background:var(--bass);} .toggle-btn.on.drm{background:var(--drm);} .toggle-btn.on.keys{background:var(--keys);} .toggle-btn.on.vox{background:var(--vox);}
  .add-musician-form{display:none;gap:8px;margin-top:10px;}
  .add-musician-form.open{display:flex;flex-wrap:wrap;}

  /* ---------- Studio : en-tête et vumètre ---------- */
  .studio-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .who-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .who-chip{padding:9px 16px;border-radius:var(--r-s);border:1px solid var(--rule);background:none;color:var(--ink-dim);font-weight:600;cursor:pointer;}
  .who-chip small{font-weight:400;opacity:.75;}
  .who-chip.selected{background:var(--ink);color:var(--console);border-color:var(--ink);}
  .who-pick{text-align:center;padding:40px 0;}
  .who-pick h2{font-size:2rem;}
  .who-big{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:24px 0 12px;}
  .who-big .who-chip{font-size:1.3rem;padding:22px 36px;border-radius:var(--r-l);}
  .level-box{display:flex;align-items:center;gap:14px;}
  .vu{width:150px;height:auto;display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35));}
  .level-text{display:flex;flex-direction:column;gap:2px;}
  .lvl{font-stretch:75%;font-weight:800;font-size:1.5rem;line-height:1;}
  .lvl-title{color:var(--amber);font-weight:600;}
  .level-sub{font-size:.8rem;color:var(--ink-dim);}
  .subtabs{display:flex;gap:4px;margin-bottom:20px;border:1px solid var(--rule);border-radius:var(--r-m);padding:4px;width:fit-content;max-width:100%;overflow-x:auto;}
  .subtab,.seg-btn{background:none;border:0;border-radius:var(--r-s);padding:8px 14px;color:var(--ink-dim);cursor:pointer;white-space:nowrap;}
  .subtab.active,.seg-btn.on{background:var(--panel-2);color:var(--ink);font-weight:600;}
  .seg{display:flex;gap:4px;border:1px solid var(--rule);border-radius:var(--r-m);padding:4px;width:fit-content;margin-bottom:10px;}
  .bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;}
  .bar > div{height:100%;background:var(--amber);}
  .bar.thin{height:4px;margin-top:8px;}

  /* ---------- Séance ---------- */
  .challenge{display:flex;gap:14px;align-items:center;background:var(--panel);border-radius:var(--r-m);padding:12px 16px;margin-bottom:16px;}
  .challenge .ico{font-size:1.4rem;}
  .challenge .ct{font-weight:600;}
  .challenge .cs{font-size:.85rem;color:var(--ink-dim);}
  .steps{display:flex;flex-direction:column;gap:10px;}
  .step{background:var(--panel);border-radius:var(--r-m);padding:16px 18px;}
  .step.prio{background:var(--panel-2);box-shadow:inset 4px 0 0 var(--amber);}
  .step.bonus{background:none;border:1px dashed var(--rule);}
  .step-head{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .step-head h3{font-size:1.15rem;display:flex;align-items:baseline;gap:10px;}
  .step-num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--rule);font-size:.85rem;font-stretch:100%;color:var(--ink-dim);flex:none;}
  .step.prio .step-num{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);}
  .step-song{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:1.1rem;}
  .step-body{color:var(--ink-dim);margin:10px 0 0;max-width:68ch;}
  .objective{margin:10px 0 0;padding:10px 14px;border-radius:var(--r-s);background:var(--ivory);color:var(--ivory-ink);font-weight:600;}
  .objective .tempo-badge{background:rgba(0,0,0,.08);color:var(--ivory-ink);}
  .objective .by{font-weight:400;font-size:.82rem;opacity:.7;margin-left:6px;}
  .objective.missing-obj{background:none;color:var(--amber);border:1px dashed var(--amber);font-weight:400;}
  .timer-btn{background:var(--console);border:1px solid var(--rule);color:var(--ink);border-radius:var(--r-s);padding:8px 12px;min-width:96px;cursor:pointer;font-weight:600;white-space:nowrap;}
  .timer-btn.running{background:var(--ok);color:#10200f;border-color:var(--ok);}
  .results{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
  .res-btn{padding:9px 14px;border-radius:var(--r-s);border:1px solid var(--rule);background:none;color:var(--ink);cursor:pointer;}
  .res-btn.on{background:var(--ink);color:var(--console);border-color:var(--ink);font-weight:700;}
  .after-result{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);}
  .finish-bar{display:flex;justify-content:flex-end;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;}
  .finish-bar .hint{margin:0;}
  .empty-state{text-align:center;padding:40px 20px;background:var(--panel);border-radius:var(--r-l);}
  .empty-state h2{font-size:1.5rem;margin-bottom:6px;}
  .empty-state p{color:var(--ink-dim);margin:0 auto 16px;max-width:44ch;}

  /* Métronome */
  .metro{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding:8px;background:var(--console);border-radius:var(--r-m);width:fit-content;}
  .metro-btn{width:44px;height:40px;border-radius:var(--r-s);border:1px solid var(--rule);background:none;color:var(--ink);cursor:pointer;font-weight:600;}
  .metro-bpm{min-width:92px;text-align:center;color:var(--ink-dim);}
  .metro-bpm output{font-stretch:75%;font-weight:800;font-size:1.7rem;color:var(--ink);margin-right:3px;}
  .metro-toggle{background:var(--panel-2);border:0;border-radius:var(--r-s);padding:10px 16px;color:var(--ink);cursor:pointer;font-weight:600;}
  .metro-toggle.on{background:var(--amber);color:var(--amber-ink);}
  .metro-dot{width:14px;height:14px;border-radius:50%;background:#3d2b14;margin:0 4px;}
  .metro-dot.tick{animation:led .12s ease-out;}
  .metro-dot.tick.accent{animation-name:ledred;}
  @keyframes led{from{background:var(--amber);box-shadow:0 0 10px var(--amber);}to{background:#3d2b14;}}
  @keyframes ledred{from{background:var(--red);box-shadow:0 0 12px var(--red);}to{background:#3d2b14;}}

  /* Enregistrement */
  .rec-chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;}
  .rec-chip{padding:7px 12px;border-radius:var(--r-s);border:1px solid var(--rule);background:none;color:var(--ink-dim);cursor:pointer;}
  .rec-chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600;}
  .rec-list{list-style:none;padding:0;margin:12px 0 0;}
  .rec-list li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--rule);font-size:.92rem;}

  /* ---------- Mes morceaux ---------- */
  .item-row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;background:var(--panel);border-radius:var(--r-m);padding:12px 14px;margin-bottom:8px;}
  .item-main{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;}
  .item-row .meta{width:100%;font-size:.82rem;color:var(--ink-dim);display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;}
  .item-actions{display:flex;gap:4px;align-items:flex-start;}
  .item-actions select{padding:6px 8px;font-size:.85rem;}
  .item-edit{grid-column:1 / -1;display:flex;gap:10px;flex-wrap:wrap;}
  .item-edit .grow{flex:1 1 260px;}
  .item-edit .field:not(.grow) input{width:100px;}
  .tempo-badge{display:inline-block;padding:1px 7px;border-radius:var(--r-s);background:var(--panel-2);font-size:.8rem;font-weight:600;white-space:nowrap;}
  .spark{vertical-align:middle;}
  .spark-line{fill:none;stroke:var(--amber);stroke-width:1.8;stroke-linejoin:round;}
  .spark-target{stroke:var(--ink-dim);stroke-dasharray:2 3;stroke-width:1;}
  .add-item{margin-top:8px;}

  /* ---------- Badges ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px;}
  .stat{background:var(--panel);border-radius:var(--r-m);padding:12px 14px;}
  .stat b{display:block;font-stretch:75%;font-weight:800;font-size:1.8rem;line-height:1.1;}
  .stat span{font-size:.82rem;color:var(--ink-dim);}
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;}
  .badge{background:var(--panel);border-radius:var(--r-m);padding:14px 12px;text-align:center;}
  .badge .ico{font-size:1.9rem;line-height:1;}
  .badge .bn{font-weight:700;margin-top:8px;}
  .badge .bd{font-size:.8rem;color:var(--ink-dim);margin-top:4px;line-height:1.35;}
  .badge .count{color:var(--amber);}
  .badge.locked .ico{filter:grayscale(1);opacity:.35;}
  .badge.locked .bn{color:var(--ink-dim);}
  .stars{color:var(--amber);letter-spacing:2px;font-size:.85rem;margin-top:2px;}
  .badge .bar{margin-top:8px;height:4px;}
  .section-label{font-size:.9rem;color:var(--ink-dim);margin:22px 0 8px;}

  /* ---------- Groupe ---------- */
  .members{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;}
  .member{background:var(--panel);border-radius:var(--r-m);padding:16px;}
  .member h3{font-size:1.3rem;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px;}
  .kpis div{display:flex;flex-direction:column;}
  .kpis dd{order:-1;}
  .kpis dt{font-size:.72rem;color:var(--ink-dim);line-height:1.2;}
  .kpis dd{margin:0;font-stretch:75%;font-weight:800;font-size:1.6rem;}
  .weeks{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;height:84px;align-items:end;margin-top:12px;}
  .wk{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px;}
  .wk-bar{background:var(--amber);border-radius:2px 2px 0 0;min-height:2px;}
  .wk span{font-size:.65rem;color:var(--ink-dim);text-align:center;white-space:nowrap;}

  /* ---------- Setlists ---------- */
  .gig-list{list-style:none;padding:0;margin:0 0 12px;}
  .gig-open{width:100%;text-align:left;background:var(--panel);border:0;border-radius:var(--r-m);padding:12px 14px;margin-bottom:6px;cursor:pointer;display:flex;flex-direction:column;}
  .gig-name{font-weight:700;}
  .gig-meta{font-size:.85rem;color:var(--ink-dim);}
  .gig-rows{list-style:none;padding:0;margin:12px 0;}
  .gig-row{display:flex;gap:12px;align-items:center;background:var(--panel);border-radius:var(--r-m);padding:10px 12px;margin-bottom:6px;}
  .gig-num{font-stretch:75%;font-weight:800;font-size:1.4rem;width:28px;text-align:right;color:var(--ink-dim);}
  .gig-row .meta{font-size:.82rem;color:var(--ink-dim);}
  .gig-actions{display:flex;}
  .print-sheet{display:none;}

  /* ---------- Réglages ---------- */
  .backup-list{list-style:none;padding:0;margin:0 0 12px;}
  .backup-list li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:.92rem;}
  .tech{background:var(--panel);border-radius:var(--r-m);padding:12px 14px;}
  .tech p{color:var(--ink-dim);font-size:.9rem;}
  .tech pre{background:var(--console);padding:12px;border-radius:var(--r-s);overflow-x:auto;font-size:.8rem;}

  /* ---------- Accès ---------- */
  .gate{max-width:380px;margin:12vh auto 0;padding:0 20px;}
  .gate h1{font-size:2.6rem;font-stretch:75%;font-weight:800;}
  .gate p{color:var(--ink-dim);}
  .gate form{display:flex;flex-direction:column;gap:14px;margin-top:20px;}
  .gate input[type=password]{font-size:1.1rem;padding:12px 14px;}

  /* ---------- Récompense ---------- */

<body>
<div id="app"><div class="loading">Chargement…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbveF8c8wjGHAaBZI7KB4E8KuHit0jt6k",
  authDomain: "setlistas.firebaseapp.com",
  projectId: "setlistas",
  storageBucket: "setlistas.firebasestorage.app",
  messagingSenderId: "137937856334",
  appId: "1:137937856334:web:f759dfb5cfe5fa4834e01f"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

// ---------------------------------------------------------------------
// Données : un « espace » Firestore dont le nom est dérivé du mot de passe.
// Sans le mot de passe, on ne peut ni deviner ni lister cet espace.
// Toutes les écritures passent par une transaction (lecture de la dernière
// version + modification), et un abonnement temps réel tient chaque appareil à jour.
// ?demo dans l'URL : même fonctionnement, mais dans le stockage local du navigateur.
// ---------------------------------------------------------------------
const DEMO = new URLSearchParams(location.search).has('demo');
const LEGACY = 'app_data';
let SPACE = null;

const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));

const fireStore = {
  async getMeta(space){ const s = await getDoc(doc(db, space, 'meta')); return s.exists() ? s.data().value : null; },
  async legacyAll(){
    const q = await getDocs(collection(db, LEGACY)); const all = {};
    q.forEach(d => all[d.id] = d.data().value); return all;
  },
  async writeAll(space, all){ for(const [k,v] of Object.entries(all)) await setDoc(doc(db, space, k), {value:v}); },
  async deleteLegacy(keys){ for(const k of keys) await deleteDoc(doc(db, LEGACY, k)); },
  async set(k, v){ await setDoc(doc(db, SPACE, k), {value:v}); },
  async removeIn(space, k){ await deleteDoc(doc(db, space, k)); },
  async remove(k){ await deleteDoc(doc(db, SPACE, k)); },
  async mutate(k, fn){
    return runTransaction(db, async tx => {
      const r = doc(db, SPACE, k); const s = await tx.get(r);
      const nv = fn(s.exists() ? clone(s.data().value) : null);
      if(nv !== undefined) tx.set(r, {value:nv});
      return nv;
    });
  },
  subscribe(cb, onErr){
    return onSnapshot(collection(db, SPACE), snap => {
      const all = {}; snap.forEach(d => all[d.id] = d.data().value); cb(all);
    }, onErr);
  },
};

const demoListeners = [];
const demoKey = (space, k) => 'demo:' + space + ':' + k;
function demoNotify(){ const all = demoReadAll(SPACE); setTimeout(() => demoListeners.forEach(cb => cb(clone(all))), 0); }
function demoReadAll(space){
  const all = {}, pre = 'demo:' + space + ':';
  for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k.startsWith(pre)) all[k.slice(pre.length)] = JSON.parse(localStorage.getItem(k)); }
  return all;
}
const demoStore = {
  async getMeta(space){ const v = localStorage.getItem(demoKey(space,'meta')); return v ? JSON.parse(v) : null; },
  async legacyAll(){
    const all = {};
    for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k.startsWith('demo:') && k.split(':').length>=2 && !k.startsWith('demo:e_')) all[k.slice(5)] = JSON.parse(localStorage.getItem(k)); }
    return all;
  },
  async writeAll(space, all){ for(const [k,v] of Object.entries(all)) localStorage.setItem(demoKey(space,k), JSON.stringify(v)); },
  async deleteLegacy(keys){ keys.forEach(k => localStorage.removeItem('demo:'+k)); },
  async set(k, v){ localStorage.setItem(demoKey(SPACE,k), JSON.stringify(v)); demoNotify(); },
  async removeIn(space, k){ localStorage.removeItem(demoKey(space,k)); },
  async remove(k){ localStorage.removeItem(demoKey(SPACE,k)); demoNotify(); },
  async mutate(k, fn){
    const cur = localStorage.getItem(demoKey(SPACE,k));
    const nv = fn(cur ? JSON.parse(cur) : null);
    if(nv !== undefined) localStorage.setItem(demoKey(SPACE,k), JSON.stringify(nv));
    demoNotify(); return nv;
  },
  subscribe(cb){
    demoListeners.push(cb); demoNotify();
    window.addEventListener('storage', e => { if(e.key && e.key.startsWith('demo:'+SPACE+':')) demoNotify(); });
    return () => {};
  },
};
const store = DEMO ? demoStore : fireStore;

async function deriveSpace(password){
  const bytes = new TextEncoder().encode('setlistas:' + password.trim());
  const hash = await crypto.subtle.digest('SHA-256', bytes);
  return 'e_' + [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2,'0')).join('').slice(0,32);
}

const INSTRUMENTS = [
  {key:'Guitare', abbr:'Guitare', cls:'gtr'},
  {key:'Basse', abbr:'Basse', cls:'bass'},
  {key:'Batterie', abbr:'Batterie', cls:'drm'},
  {key:'Clavier', abbr:'Clavier', cls:'keys'},
  {key:'Chant', abbr:'Voix', cls:'vox'},
];
const REQUIRED = ['Guitare','Basse','Batterie'];

let songs = [], musicians = [], mastery = {};
let activeTab = 'studio';
let searchQuery = '';
let sortMode = 'title';
let groupByArtist = true;
let selectedForSetlist = new Set(['seb','arthur']);
let selectedGridMusician = null;
let pendingDeleteMusician = null;
let addSongFormOpen = false;

// ---------- Studio : état ----------
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
let progress = {};
let studioWho = lsGet('setlistas-who');
let studioView = 'seance';
let session = (()=>{ try{ return JSON.parse(lsGet('setlistas-session')); }catch(e){ return null; } })();
let swapOpen = false;
let timer = {step:null, endAt:null, remaining:null};
let timerInterval = null;
let toast = null;
let recDraft = {songId:null, ins:[]};

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

let saveError = null;
let importError = null;
let pendingImport = null;
let importBusy = false;
let gigs = {};
let backups = [];
let meta = null;
let firstSnapshot = true;
let changingPassword = false;

// Écriture sûre : relit la dernière version, applique la modification, réessaie en cas d'échec.
async function save(key, fn){
  for(let i=0;i<3;i++){
    try{ const v = await store.mutate(key, fn); if(saveError){ saveError = null; scheduleRender(); } return v; }
    catch(e){
      console.warn('save failed', key, e);
      if(i===2){ saveError = "Modification non enregistrée : vérifie la connexion, puis recommence."; scheduleRender(); return undefined; }
      await sleep(600*(i+1));
    }
  }
}

// Ne pas redessiner l'écran pendant qu'on tape : on attend la fin de la saisie.
let renderPending = false;
function isEditing(){
  const a = document.activeElement;
  return !!a && ['INPUT','TEXTAREA','SELECT'].includes(a.tagName) && document.getElementById('app').contains(a) && a.type!=='checkbox' && a.type!=='file';
}
function scheduleRender(){ if(isEditing()){ renderPending = true; return; } render(); }
document.addEventListener('focusout', () => setTimeout(() => { if(renderPending && !isEditing()){ renderPending = false; render(); } }, 60));

function applyAll(all){
  lastAll = all;
  songs = Array.isArray(all.songs) ? all.songs : [];
  musicians = Array.isArray(all.musicians) ? all.musicians : [];
  mastery = {};
  musicians.forEach(m => mastery[m.id] = all['mastery:'+m.id] || {});
  progress = {};
  studioMusicians().forEach(m => { progress[m.id] = all['progress:'+m.id] ? normalizeProgress(all['progress:'+m.id]) : emptyProgress(); });
  // Succès déjà acquis : marqués comme vus, sans redonner d'XP.
  studioMusicians().forEach(m => { const p = progress[m.id]; if(!p.seen){ p.seen = achievements(m.id); p.seenDates = p.seenDates || {}; } });
  gigs = all.gigs || {};
  meta = all.meta || null;
  backups = Object.keys(all).filter(k => k.startsWith('backup:')).sort().reverse();
  if(!selectedGridMusician && studioWho && musicians.some(m=>m.id===studioWho)) selectedGridMusician = studioWho;
}

async function start(){
  document.getElementById('app').innerHTML = '<div class="loading">Chargement…</div>';
  store.subscribe(all => {
    if(changingPassword) return;
    if(!all.meta){
      // Espace vide : le mot de passe a été changé sur un autre appareil.
      if(lsGet('setlistas-space')===SPACE) lsSet('setlistas-space', null);
      try{ if(sessionStorage.getItem('setlistas-space')===SPACE) sessionStorage.removeItem('setlistas-space'); }catch(e){}
      SPACE = null; gate = {step:'login', error:'Le mot de passe a été changé. Entre le nouveau.'}; renderGate();
      return;
    }
    applyAll(all);
    if(firstSnapshot){
      firstSnapshot = false;
      if(location.hash === '#studio' || (studioWho && musicians.some(m=>m.id===studioWho))) activeTab = 'studio';
      render();
      dailyBackup(all);
    } else scheduleRender();
  }, err => {
    console.warn(err);
    document.getElementById('app').innerHTML = `<div class="gate"><h1>Accès impossible</h1><p>Les données n'ont pas pu être chargées (${escapeHtml(err.code||err.message||'erreur')}). Vérifie la connexion et recharge la page.</p></div>`;
  });
}

// ---------- Sauvegardes ----------
function snapshotOf(all){
  const out = {};
  Object.entries(all).forEach(([k,v]) => { if(k!=='meta' && !k.startsWith('backup:')) out[k] = v; });
  return out;
}
async function dailyBackup(all){
  const key = 'backup:' + todayStr();
  if(all[key]) return;
  try{
    await store.set(key, {at: new Date().toISOString(), data: snapshotOf(all)});
    const old = Object.keys(all).filter(k => /^backup:\d{4}-\d{2}-\d{2}/.test(k)).sort().reverse().slice(13);
    for(const k of old) await store.remove(k);
  }catch(e){ console.warn('backup failed', e); }
}
async function manualBackup(label){
  const all = {songs, musicians, gigs};
  musicians.forEach(m => all['mastery:'+m.id] = mastery[m.id]);
  Object.entries(progress).forEach(([id,p]) => all['progress:'+id] = p);
  const key = 'backup:' + todayStr() + '-' + label + '-' + Date.now().toString(36);
  await store.set(key, {at: new Date().toISOString(), data: clone(all)});
}

function studioMusicians(){ return musicians.filter(m => !m.universal); }

function emptyProgress(){ return {items:{}, sessions:[], badges:{}, xp:0, dustCount:0, tempoRecords:0, challenges:{}, seen:null, seenDates:{}}; }
function normalizeProgress(p){ return Object.assign(emptyProgress(), p, {items:p.items||{}, sessions:p.sessions||[], badges:p.badges||{}, challenges:p.challenges||{}}); }

function normTitle(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,''); }

function nameById(id){ const m = musicians.find(x=>x.id===id); return m ? m.name : id; }

function songMastersFor(songId, instrumentKey){
  return musicians.filter(m => (mastery[m.id][songId]||[]).includes(instrumentKey)).map(m=>m.name);
}

function renderTabs(){
  const t = (k,l) => `<button class="tab ${activeTab===k?'active':''}" data-tab="${k}" ${activeTab===k?'aria-current="page"':''}>${l}</button>`;
  return `<nav class="tabs" aria-label="Sections">${t('studio','Studio')}${t('repertoire','Répertoire')}${t('setlist','Setlists')}${t('grille','Ma grille')}${t('reglages','Réglages')}</nav>`;
}

function renderRepertoire(){
  let filtered = songs.filter(s =>
    !searchQuery || (s.title+' '+s.artist).toLowerCase().includes(searchQuery.toLowerCase())
  );

  const collator = new Intl.Collator('fr', {sensitivity:'base'});
  if(sortMode==='title') filtered.sort((a,b)=>collator.compare(a.title,b.title));
  else if(sortMode==='artist') filtered.sort((a,b)=>collator.compare(a.artist,b.artist) || collator.compare(a.title,b.title));
  else filtered.sort((a,b)=>a.id-b.id);

  const renderCard = song => {
    if(editingSong===song.id) return `<div class="song-card editing">${songEditForm(song)}</div>`;
    const tags = INSTRUMENTS.map(ins => {
      const names = songMastersFor(song.id, ins.key);
      if(names.length===0) return '';
      return `<span class="tag ${ins.cls}"><span class="dot"></span>${ins.abbr} <span class="names">${names.join(', ')}</span></span>`;
    }).join('');
    const extra = [song.key, song.duration].filter(Boolean).map(escapeHtml).join(', ');
    return `<div class="song-card">
      <div class="song-top">
        <div><span class="song-title">${escapeHtml(song.title)}</span>${groupByArtist ? '' : ` <span class="song-artist">${escapeHtml(song.artist)}</span>`}${extra ? ` <span class="song-extra">${extra}</span>` : ''}</div>
        <button class="icon-btn" data-editsong="${song.id}" aria-label="Modifier ${escapeAttr(song.title)}">✎</button>
      </div>
      <div class="tags">${tags || '<span class="tag-empty">Personne ne l\u2019a encore coché.</span>'}</div>
      ${songLinks(song)}
    </div>`;
  };

  let cards = '';
  if(groupByArtist){
    const sorted = [...filtered].sort((a,b)=>collator.compare(a.artist,b.artist) || collator.compare(a.title,b.title));
    let currentArtist = null;
    sorted.forEach(song => {
      if(song.artist !== currentArtist){
        currentArtist = song.artist;
        cards += `<div class="artist-header">${escapeHtml(currentArtist)}</div>`;
      }
      cards += renderCard(song);
    });
  } else {
    cards = filtered.map(renderCard).join('');
  }

  return `
    <input type="text" class="search" id="search" placeholder="Chercher un morceau ou un artiste…" value="${escapeAttr(searchQuery)}">
    <div class="row" style="margin:12px 0 16px">
      <label style="font-size:0.85rem;color:var(--ink-dim)">Trier par</label>
      <select id="sort-select">
        <option value="num" ${sortMode==='num'?'selected':''}>N° (ordre d'ajout)</option>
        <option value="title" ${sortMode==='title'?'selected':''}>Titre (A-Z)</option>
        <option value="artist" ${sortMode==='artist'?'selected':''}>Artiste (A-Z)</option>
      </select>
      <label class="check"><input type="checkbox" id="group-toggle" ${groupByArtist?'checked':''}> Grouper par artiste</label>
    </div>
    <div class="row">
      <button class="btn-ghost" id="add-song-btn">Ajouter un morceau</button>
      <span class="grow"></span>
      <button class="btn-ghost small" id="export-csv-btn">Exporter en CSV</button>
      <button class="btn-ghost small" id="import-csv-btn">Importer un CSV</button>
      <input type="file" id="import-csv-input" accept=".csv" hidden>
    </div>
    <div class="add-musician-form ${addSongFormOpen?'open':''}" id="add-song-form">
      <input type="text" id="new-song-title" placeholder="Titre du morceau">
      <input type="text" id="new-song-artist" placeholder="Artiste">
      <div><button class="btn" id="confirm-new-song">Ajouter</button></div>
    </div>
    ${cards || '<p style="color:var(--ink-dim)">Aucun morceau ne correspond.</p>'}
  `;
}

function computeSetlist(){ return computeSetlistFor([...selectedForSetlist]); }
function computeSetlistFor(ids){
  const selected = musicians.filter(m => ids.includes(m.id));
  const universalSelected = selected.filter(m=>m.universal);
  return songs.map(song => {
    const coverage = {};
    INSTRUMENTS.forEach(ins => {
      coverage[ins.key] = selected.filter(m=>!m.universal && (mastery[m.id][song.id]||[]).includes(ins.key)).map(m=>m.name);
    });
    const requiredGaps = REQUIRED.filter(r => coverage[r].length===0);
    const chantGap = coverage['Chant'].length===0;

    // Un backup universel ne peut jouer qu'un seul instrument à la fois par morceau.
    // Franck ne chante jamais : le backup universel ne couvre que les instruments requis, pas le chant.
    const universalPool = [...universalSelected];
    const backupLabel = {};
    requiredGaps.forEach(insKey => {
      if(universalPool.length) backupLabel[insKey] = universalPool.shift().name;
    });

    const missingRequired = requiredGaps.filter(insKey => !backupLabel[insKey]);
    const missingChant = chantGap;

    return {
      song, coverage, backupLabel,
      missingRequired, missingChant,
      playable: missingRequired.length===0,
      fullyComplete: missingRequired.length===0 && !missingChant,
    };
  }).sort((a,b)=>a.song.id-b.song.id);
}

function renderSetlist(){
  const chips = musicians.map(m => `<div class="chip ${selectedForSetlist.has(m.id)?'selected':''} ${m.universal?'universal':''}" data-musician="${m.id}">${escapeHtml(m.name)}</div>`).join('');
  const results = computeSetlist();
  const complete = results.filter(r=>r.fullyComplete);
  const missingSinger = results.filter(r=>r.playable && r.missingChant);
  const incomplete = results.filter(r=>!r.playable);

  const renderResult = r => {
    const covRow = REQUIRED.map(ins => {
      const names = r.coverage[ins];
      const label = names.length ? names.join(', ') : (r.backupLabel[ins] ? r.backupLabel[ins] + ' (backup)' : '—');
      return `<span class="coverage-item ${names.length?'':(r.backupLabel[ins]?'backup':'missing')}"><b>${ins}</b> ${label}</span>`;
    }).join('');
    const voxNames = r.coverage['Chant'];
    let voxItem;
    if(voxNames.length) voxItem = `<span class="coverage-item"><b>Chant</b> ${voxNames.join(', ')}</span>`;
    else voxItem = `<span class="coverage-item missing"><b>Chant</b> —</span>`;
    if(r.coverage['Clavier'].length) voxItem += `<span class="coverage-item"><b>Clavier</b> ${r.coverage['Clavier'].join(', ')}</span>`;
    return `<div class="song-card">
      <div class="song-top"><div><span class="song-title">${escapeHtml(r.song.title)}</span> <span class="song-artist">${escapeHtml(r.song.artist)}</span></div></div>
      <div class="coverage-row">${covRow}${voxItem}</div>
    </div>`;
  };

  if(openGig && gigs[openGig]) return renderGigs();
  return `
    <p class="lede">Sélectionne les musiciens présents : l'appli liste ce que vous pouvez jouer ensemble (guitare, basse et batterie couvertes). Franck, en backup, peut tenir un instrument par morceau, mais ne chante pas.</p>
    <div class="chip-select">${chips}</div>
    ${renderGigs()}
    <h2 class="section-title">${complete.length} morceaux complets, chant compris</h2>
    ${complete.map(renderResult).join('') || '<p class="empty">Aucun morceau complet avec ce groupe.</p>'}
    <h2 class="section-title">${missingSinger.length} morceaux jouables sans chanteur</h2>
    ${missingSinger.map(renderResult).join('') || '<p class="empty">Aucun.</p>'}
    <details>
      <summary>${incomplete.length} morceaux incomplets avec ce groupe</summary>
      ${incomplete.map(r=>`<div class="song-card"><div class="song-top"><div><span class="song-title">${escapeHtml(r.song.title)}</span></div></div><p class="warn-text small">Il manque : ${r.missingRequired.join(', ').toLowerCase()}</p></div>`).join('')}
    </details>
  `;
}

function renderGrille(){
  const options = musicians.map(m => `<option value="${m.id}" ${selectedGridMusician===m.id?'selected':''}>${escapeHtml(m.name)}${m.universal?' ★':''}</option>`).join('');
  const chosen = musicians.find(m=>m.id===selectedGridMusician);

  let body = '';
  if(!chosen){
    body = `<p style="color:var(--ink-dim);font-size:0.9rem;margin-top:14px">Choisis ton nom pour renseigner ce que tu sais jouer sur chaque morceau.</p>`;
  } else if(chosen.universal){
    body = `<div class="note" style="margin-top:16px">${escapeHtml(chosen.name)} est backup universel : peut couvrir n'importe quel instrument, sur n'importe quel morceau. Pas de saisie nécessaire — mais dans une setlist, ${escapeHtml(chosen.name)} ne peut combler qu'un seul manque à la fois par morceau (on ne joue pas guitare et batterie en même temps).</div>`;
  } else {
    const collator = new Intl.Collator('fr', {sensitivity:'base'});
    const sortedSongs = [...songs].sort((a,b)=>collator.compare(a.artist,b.artist) || collator.compare(a.title,b.title));
    let currentArtist = null;
    const rows = sortedSongs.map(song => {
      let header = '';
      if(song.artist !== currentArtist){
        currentArtist = song.artist;
        header = `<tr><td colspan="${INSTRUMENTS.length+1}" class="grid-artist-header">${escapeHtml(currentArtist)}</td></tr>`;
      }
      const known = mastery[chosen.id][song.id] || [];
      const cells = INSTRUMENTS.map(ins => {
        const on = known.includes(ins.key);
        return `<td class="toggle-cell"><button class="toggle-btn ${on?'on '+ins.cls:''}" data-song="${song.id}" data-ins="${ins.key}">${ins.abbr}</button></td>`;
      }).join('');
      return header + `<tr><td class="grid-song-name">${escapeHtml(song.title)}</td>${cells}</tr>`;
    }).join('');
    body = `<table class="grid-table">
      <thead><tr><th></th>${INSTRUMENTS.map(i=>`<th>${i.abbr}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  return `
    <div class="row">
      <label style="font-size:0.85rem;color:var(--ink-dim)">Qui es-tu ?</label>

function weekChallenge(day=todayStr()){

}
function challengeProgress(mid){

const LEVEL_TITLES = ['Débutant','Apprenti','Musicien de garage','Habitué des jams','Musicien de bar','Première partie','Tête d’affiche','Légende du studio'];
function levelTitle(L){ return LEVEL_TITLES[Math.min(L, LEVEL_TITLES.length)-1]; }

function todayStr(d=new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDay(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function daysBetween(a,b){ return Math.round((parseDay(b)-parseDay(a))/86400000); }
function weekKey(s){ const d=parseDay(s); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return todayStr(d); }
function songById(id){ return songs.find(s => String(s.id)===String(id)); }
function itemsOf(mid){ return Object.entries((progress[mid]||{}).items||{}).map(([key,it]) => ({key, ...it})).filter(it => songById(it.songId)); }
function wipSorted(mid){
  return itemsOf(mid).filter(i=>i.status==='wip')
    .sort((a,b)=>(a.lastWorked||'').localeCompare(b.lastWorked||'') || (a.createdAt||'').localeCompare(b.createdAt||'') || a.key.localeCompare(b.key));
}
function levelOf(xp){ let L=1; while(xp >= 25*L*(L+1)) L++; return L; }   // niveau 2 à 50 XP, 3 à 150, 4 à 300…
function levelFloor(L){ return 25*(L-1)*L; }

function uniqueDays(mid){ return [...new Set((progress[mid]?.sessions||[]).map(s=>s.date))].sort(); }
function maxStreak(days){
  let best=0, cur=0, prev=null;
  days.forEach(d => { cur = (prev && daysBetween(prev,d)===1) ? cur+1 : 1; best=Math.max(best,cur); prev=d; });
  return best;
}
function currentStreak(mid){
  const days = uniqueDays(mid); if(!days.length) return 0;
  const last = days[days.length-1]; const t = todayStr();
  if(daysBetween(last,t) > 1) return 0;
  let n=1; for(let i=days.length-1;i>0;i--){ if(daysBetween(days[i-1],days[i])===1) n++; else break; }
  return n;
}
function weekStreakMax(mid){
  const per = {};
  (progress[mid]?.sessions||[]).forEach(s => { const k=weekKey(s.date); per[k]=(per[k]||0)+1; });
  const weeks = Object.keys(per).filter(k=>per[k]>=2).sort();
  let best=0, cur=0, prev=null;
  weeks.forEach(w => { cur = (prev && daysBetween(prev,w)===7) ? cur+1 : 1; best=Math.max(best,cur); prev=w; });
  return best;
}
function stats(mid){
  const p = progress[mid] || emptyProgress();
  const results = p.sessions.flatMap(s=>s.items||[]);
  const perWeek = {};
  p.sessions.forEach(s => { const k=weekKey(s.date); perWeek[k]=(perWeek[k]||0)+1; });
  const days = uniqueDays(mid);
  const myDays = new Set(days);
  const otherDays = new Set(studioMusicians().filter(o=>o.id!==mid).flatMap(o=>(progress[o.id]?.sessions||[]).map(s=>s.date)));
  let comebacks = 0; for(let i=1;i<days.length;i++) if(daysBetween(days[i-1],days[i])>=7) comebacks++;
  const plan = p.sessions.filter(s=>s.followedPlan).length;
  return {
    sessions: p.sessions.length,
    reached: results.filter(r=>r.result==='reached').length,
    mastered: Object.values(p.items).filter(i=>i.status==='done' && i.masteredAt).length,
    streak: currentStreak(mid),
    maxStreak: maxStreak(days),
    maxWeekStreak: weekStreakMax(mid),
    instruments: new Set(results.map(r=>r.key.split('|')[1])).size,
    plan,
    planSets: Math.floor(plan/5),
    fullWeeks: Object.values(perWeek).filter(n=>n>=4).length,
    duoDays: [...myDays].filter(d=>otherDays.has(d)).length,
    dust: p.dustCount||0,
    comebacks,
    challenges: Object.keys(p.challenges||{}).length,
    tempoRecords: p.tempoRecords||0,
    ...recordStats(mid),
  };
}
// Instruments enregistrés par morceau, Seb et Arthur confondus : {songId: Set(instruments)}
function recordedBySong(){
  const map = {};
  studioMusicians().forEach(m => (progress[m.id]?.sessions||[]).forEach(se => (se.recordings||[]).forEach(r => {
    (map[r.songId] = map[r.songId] || new Set());
    r.ins.forEach(i => map[r.songId].add(i));
  })));
  return map;
}
function recordStats(mid){
  const mine = (progress[mid]?.sessions||[]).flatMap(se => se.recordings||[]);
  const mySongs = new Set(mine.map(r => String(r.songId)));
  const all = recordedBySong();
  const sizes = Object.entries(all).filter(([id]) => mySongs.has(String(id))).map(([,set]) => set.size);
  return {
    records: mine.reduce((n,r) => n + r.ins.length, 0),
    multitrack: Math.max(0, ...sizes),
    boxed: sizes.filter(n => n>=3).length,
  };
}
function U(t,n){ return n>1 ? t.unit[1] : t.unit[0]; }
function tierOf(value, steps){ return steps.filter(x => value>=x).length; }
function achievements(mid){
  const st = stats(mid);
  const wip = itemsOf(mid).filter(i=>i.status==='wip');
  const out = {};
  TIERED.forEach(t => out['t:'+t.id] = tierOf(st[t.stat], t.steps));
  REPEAT.forEach(r => out['r:'+r.id] = st[r.stat]);
  out['o:precise'] = (wip.length>=2 && wip.every(i => (i.objective||'').trim().length>=8)) ? 1 : 0;
  return out;
}
// Prochain palier le plus proche, pour encourager.
function nextGoal(mid){
  const st = stats(mid); let best = null;
  TIERED.forEach(t => {
    const tier = tierOf(st[t.stat], t.steps); if(tier>=t.steps.length) return;
    const target = t.steps[tier], left = target - st[t.stat];
    const ratio = left / target;
    if(!best || ratio < best.ratio) best = {ratio, text:`${t.ico} ${t.name} : plus que ${left} pour atteindre ${target} ${U(t,target)}`};
  });
  return best ? best.text : null;
}

// Compare les succès actuels à ceux déjà vus, attribue les XP et renvoie les nouveautés (avec .xp).
function checkBadges(mid){
  const p = progress[mid]; const fresh = []; fresh.xp = 0;
  if(!p) return fresh;
  const a = achievements(mid), today = todayStr();
  p.seen = p.seen || {}; p.seenDates = p.seenDates || {};
  TIERED.forEach(t => {
    const k='t:'+t.id, n=a[k], old=p.seen[k]||0;
    if(n>old){
      for(let i=old+1;i<=n;i++) fresh.xp += XP.tier*i;
      fresh.push({ico:t.ico, name:`${t.name} ${'★'.repeat(n)}`, desc:`${t.steps[n-1]} ${U(t,t.steps[n-1])}`});
      p.seen[k]=n; p.seenDates[k]=today;
    }
  });
  REPEAT.forEach(r => {
    const k='r:'+r.id, n=a[k], old=p.seen[k]||0;
    if(n>old){
      fresh.xp += r.xp*(n-old);
      fresh.push({ico:r.ico, name: n>1 ? `${r.name} ×${n}` : r.name, desc:r.desc});
      p.seen[k]=n; p.seenDates[k]=today;
    }
  });
  ONCE.forEach(o => {
    const k='o:'+o.id;
    if(a[k] && !p.seen[k]){ fresh.xp += XP.once; fresh.push({ico:o.ico, name:o.name, desc:o.desc}); p.seen[k]=1; p.seenDates[k]=today; }
  });
  p.xp = (p.xp||0) + fresh.xp;
  return fresh;
}

// Séance du jour : créée au premier geste (minuteur, résultat, changement de priorité).
function currentSession(){

  return session;
}
function ensureSession(plan){
  if(!currentSession()){
    session = {who:studioWho, date:todayStr(), proposedKey:plan.proposed?.key||null, priorityKey:null, swapped:false, results:{}, mastered:{}, newObjectives:{}, tempos:{}, recordings:[]};
  }
  return session;
}

function buildPlan(mid){
  const wip = wipSorted(mid);
  const s = currentSession();
  const proposed = wip[0] || null;
  let priority = proposed;
  if(s && s.priorityKey){ priority = wip.find(i=>i.key===s.priorityKey) || proposed; }
  // De préférence un autre morceau que la priorité (pas la même chanson à un autre instrument).
  const second = (priority && (wip.find(i => i.songId!==priority.songId) || wip.find(i => i.key!==priority.key))) || null;
  // Sans deuxième morceau en cours : on repasse un morceau du répertoire, choisi selon le jour.
  let review = null;
  if(!second){
    const known = Object.entries(mastery[mid]||{}).filter(([id,ins]) => ins && ins.length && songById(id));
    if(known.length){
      const t = todayStr(); let h=0; for(const c of t) h=(h*31+c.charCodeAt(0))%9973;
      const [id,ins] = known[h % known.length];
      review = {song: songById(id), ins: ins[0]};
    }
  }
  return {wip, proposed, priority, second, review};
}

function fmtTime(sec){ sec=Math.max(0,Math.ceil(sec)); return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); }
function timerLabel(stepId, minutes){
  if(timer.step===stepId){
    const rem = timer.endAt ? (timer.endAt-Date.now())/1000 : timer.remaining;

}

// Vumètre : l'aiguille indique la progression vers le niveau suivant.
function vuMeter(pct){
  const cx=100, cy=104, r=78, a0=-50, a1=50;
  const pt = (deg, rad) => { const t=(deg-90)*Math.PI/180; return [(cx+rad*Math.cos(t)).toFixed(1),(cy+rad*Math.sin(t)).toFixed(1)]; };
  const arc = (d0,d1,rad) => { const [x0,y0]=pt(d0,rad), [x1,y1]=pt(d1,rad); return `M${x0} ${y0} A${rad} ${rad} 0 0 1 ${x1} ${y1}`; };
  const ticks = []; for(let i=0;i<=10;i++){ const d=a0+i*(a1-a0)/10, [x0,y0]=pt(d,r-(i%5?6:11)), [x1,y1]=pt(d,r); ticks.push(`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/>`); }
  const ang = a0 + (a1-a0)*Math.max(0,Math.min(100,pct))/100;
  const [nx,ny] = pt(ang, r+4);
  return `<svg class="vu" viewBox="0 0 200 118" role="img" aria-label="Progression vers le niveau suivant : ${pct} %">
    <rect x="2" y="2" width="196" height="114" rx="10" fill="#EFE4B8" stroke="#1E2421" stroke-width="3"/>
    <path d="${arc(a0, a0+(a1-a0)*0.8, r)}" fill="none" stroke="#2B2A22" stroke-width="2"/>
    <path d="${arc(a0+(a1-a0)*0.8, a1, r)}" fill="none" stroke="#E04A3C" stroke-width="5"/>
    <g stroke="#2B2A22" stroke-width="1.6">${ticks.join('')}</g>
    <text x="100" y="74" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="800" font-size="15" fill="#2B2A22" style="font-stretch:75%">VU</text>
    <line class="vu-needle" x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#1E2421" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="7" fill="#1E2421"/>
  </svg>`;
}

function renderStudio(){
  const me = musicians.find(m => m.id===studioWho);
  if(!me){
    return `<div class="who-pick"><h2>Qui joue ?</h2><div class="who-big">${whoChips(true)}</div>

  }
  if(!progress[studioWho]) progress[studioWho] = emptyProgress();
  const p = progress[studioWho];
  const L = levelOf(p.xp||0), lo = levelFloor(L), hi = levelFloor(L+1);
  const pct = Math.round(100*((p.xp||0)-lo)/(hi-lo));
  const streak = currentStreak(studioWho);
  const nBadges = Object.values(p.seen||{}).filter(v=>v>0).length;
  const head = `<div class="studio-head">

        <div class="level-text">
          <span class="lvl">Niveau ${L}</span><span class="lvl-title">${levelTitle(L)}</span>
          <span class="level-sub">${p.xp||0} XP, encore ${hi-(p.xp||0)} pour le niveau ${L+1}</span>
          <span class="level-sub">${streak?`${streak} jour${streak>1?'s':''} de suite, `:''}${nBadges ? `${nBadges} badge${nBadges>1?'s':''}` : 'aucun badge pour l\u2019instant'}</span>
        </div>
      </div>
    </div>
    <nav class="subtabs" aria-label="Studio">
      ${[['seance','Séance du jour'],['morceaux','Mes morceaux'],['badges','Badges'],['groupe','Le groupe']].map(([k,l])=>`<button class="subtab ${studioView===k?'active':''}" data-sv="${k}">${l}</button>`).join('')}
    </nav>`;
  const body = studioView==='morceaux' ? renderMyItems() : studioView==='badges' ? renderBadges() : studioView==='groupe' ? renderGroup() : renderSeance();
  return head + body;
}

      <div class="weeks" aria-label="Séances des six dernières semaines">${perWeek.map((n,i)=>`<div class="wk"><div class="wk-bar" style="height:${Math.round(100*n/max)}%"></div><span>${i===5?'cette sem.':parseDay(weeks[i]).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</span></div>`).join('')}</div>
    </div>`;
  }).join('');
  const total = students.reduce((n,m)=>n+(progress[m.id]?.sessions||[]).filter(x=>weekKey(x.date)===wk).length,0);

  return `<p class="lede">${total ? `Cette semaine, le groupe a fait ${total} séance${total>1?'s':''}.` : `Pas encore de séance cette semaine. La première lance la semaine.`} Défi commun : ${ch.text.toLowerCase()}.</p>

}

  const pr = plan.priority, song = songById(pr.songId);
  if(metro.key !== pr.key && !metro.running){
    const last = pr.tempoLog?.length ? pr.tempoLog[pr.tempoLog.length-1].bpm : null;

// ---------- Métronome ----------
const metro = {running:false, bpm:80, ctx:null, next:0, beat:0, timer:null, key:null, usedKey:null};
function metroClick(time, accent){
  const c = metro.ctx, o = c.createOscillator(), g = c.createGain();
  o.frequency.value = accent ? 1600 : 1050;
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(accent ? 0.5 : 0.3, time + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
  o.connect(g); g.connect(c.destination); o.start(time); o.stop(time + 0.06);
  const delay = Math.max(0, (time - c.currentTime) * 1000);
  setTimeout(() => {
    const d = document.getElementById('metro-dot'); if(!d) return;
    d.classList.toggle('accent', accent); d.classList.remove('tick'); void d.offsetWidth; d.classList.add('tick');
  }, delay);
}
function metroSchedule(){
  while(metro.next < metro.ctx.currentTime + 0.12){
    metroClick(metro.next, metro.beat % 4 === 0);
    metro.next += 60 / metro.bpm; metro.beat++;
  }
}
function metroStart(){
  try{
    metro.ctx = metro.ctx || new (window.AudioContext||window.webkitAudioContext)();
    metro.ctx.resume();
    metro.running = true; metro.beat = 0; metro.next = metro.ctx.currentTime + 0.06; metro.usedKey = metro.key;
    metro.timer = setInterval(metroSchedule, 25);
  }catch(e){ metro.running = false; }
  wakeLockUpdate();
}
function metroStop(){ if(metro.timer) clearInterval(metro.timer); metro.timer = null; metro.running = false; wakeLockUpdate(); }

// ---------- Écran allumé pendant le minuteur ou le métronome ----------
let wakeLock = null;
async function wakeLockUpdate(){
  const need = metro.running || !!(timer.step && timer.endAt);
  try{
    if(need && !wakeLock && 'wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if(!need && wakeLock){ const w = wakeLock; wakeLock = null; await w.release(); }
  }catch(e){}
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') wakeLockUpdate(); });

function sparkline(log, target){
  if(!log || log.length < 2) return '';
  const pts = log.slice(-12), w = 90, h = 24;
  const vals = pts.map(x=>x.bpm).concat(target ? [target] : []);
  const lo = Math.min(...vals) - 2, hi = Math.max(...vals) + 2;
  const y = v => (h - (v-lo)/(hi-lo)*h).toFixed(1);
  const d = pts.map((x,i) => `${i?'L':'M'}${(i*(w/(pts.length-1))).toFixed(1)},${y(x.bpm)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
    ${target ? `<line x1="0" x2="${w}" y1="${y(target)}" y2="${y(target)}" class="spark-target"/>` : ''}
    <path d="${d}" class="spark-line"/></svg>`;
}
function tempoLabel(it){
  const last = it.tempoLog?.length ? it.tempoLog[it.tempoLog.length-1].bpm : null;
  if(!last && !it.tempoTarget) return '';
  return `<span class="tempo-badge">♩ ${last ?? '–'}${it.tempoTarget ? ` / ${it.tempoTarget}` : ''} bpm</span>`;
}
function songLinks(song){
  if(!song) return '';
  const l = [];
  if(song.moises) l.push(`<a class="ext" href="${escapeAttr(song.moises)}" target="_blank" rel="noopener">Backing (Moises)</a>`);
  if(song.newzik) l.push(`<a class="ext" href="${escapeAttr(song.newzik)}" target="_blank" rel="noopener">Partition (Newzik)</a>`);
  if(song.key) l.push(`<span class="song-key">Tonalité : ${escapeHtml(song.key)}</span>`);
  return l.length ? `<div class="links">${l.join('')}</div>` : '';
}
function objectiveAuthor(it, mid){
  return it.objectiveBy && it.objectiveBy !== mid ? `<span class="by">fixé par ${escapeHtml(nameById(it.objectiveBy))}</span>` : '';
}

// Modifie la progression d'un musicien : d'abord en local (affichage immédiat),
// puis en transaction sur la dernière version enregistrée (aucune perte entre appareils).
function runOnProgress(mid, p, fn){
  const prev = progress[mid]; progress[mid] = p;
  try{
    if(!p.seen){ p.seen = achievements(mid); p.seenDates = p.seenDates || {}; }
    return fn(p);
  } finally { progress[mid] = prev; }
}
function updateProgress(mid, fn){
  const local = normalizeProgress(clone(progress[mid] || emptyProgress()));
  const result = runOnProgress(mid, local, fn);
  progress[mid] = local;
  save('progress:'+mid, cur => {
    const p = normalizeProgress(cur || emptyProgress());
    runOnProgress(mid, p, fn);
    return p;
  });
  return result;
}

function addMastery(mid, songId, ins){
  const cur = mastery[mid][String(songId)] || [];
  if(cur.includes(ins)) return;
  mastery[mid][String(songId)] = [...cur, ins];
  save('mastery:'+mid, m => { m = m || {}; const a = m[String(songId)] || []; if(!a.includes(ins)) a.push(ins); m[String(songId)] = a; return m; });
}

function finishSession(){
  const s = currentSession(); if(!s) return;
  const who = s.who, today = todayStr();
  const worked = Object.entries(s.results).filter(([k,r]) => (r==='reached'||r==='progress') && progress[who]?.items[k]);
  const recs = (s.recordings||[]).filter(r => songById(r.songId) && r.ins.length);
  if(!worked.length && !recs.length) return;
  const ts = new Date().toISOString();
  const levelBefore = levelOf(progress[who].xp||0);
  const res = updateProgress(who, p => {
    if(p.sessions.some(x => x.ts===ts)) return null;   // déjà appliquée
    const xpBefore = p.xp||0;
    const prevDays = [...new Set(p.sessions.map(x=>x.date))].filter(d => d!==today).sort();
    const comeback = prevDays.length && daysBetween(prevDays[prevDays.length-1], today) >= 7;
    let xp = XP.session; const msgs = []; const mastered = [];
    // Enregistrements : multiplicateur = nombre d'instruments réunis sur le morceau (tous musiciens).
    const known = recordedBySong(); let bestMult = 1;
    recs.forEach(r => {
      const set = new Set(known[r.songId] || []);
      r.ins.forEach(i => { if(set.has(i)) xp += XP.record; else { set.add(i); xp += XP.record*set.size; bestMult = Math.max(bestMult, set.size); } });
      known[r.songId] = set;
    });
    worked.forEach(([k,r]) => {
      const it = p.items[k]; if(!it) return;
      if(it.lastWorked && daysBetween(it.lastWorked, today) >= 14) p.dustCount = (p.dustCount||0)+1;
      it.lastWorked = today;
      it.workedCount = (it.workedCount||0)+1;
      const bpm = Number(s.tempos?.[k]);
      if(bpm > 0){
        it.tempoLog = [...(it.tempoLog||[]), {date:today, bpm}].slice(-60);
        if(it.tempoBest && bpm > it.tempoBest){ p.tempoRecords = (p.tempoRecords||0)+1; msgs.push(`🚀 Record de tempo sur ${songById(it.songId).title} : ${bpm} bpm.`); }
        if(it.tempoTarget && bpm >= it.tempoTarget && !(it.tempoBest >= it.tempoTarget)) msgs.push(`Tempo cible atteint sur ${songById(it.songId).title} !`);
        it.tempoBest = Math.max(it.tempoBest||0, bpm);
      }
      if(r==='reached'){
        xp += XP.reached;
        if(it.objectiveBy && it.objectiveBy !== who){ xp += XP.teacher; msgs.push(`🎓 Objectif de ${nameById(it.objectiveBy)} atteint : +${XP.teacher} XP bonus.`); }
        it.reachedCount = (it.reachedCount||0)+1;
        it.lastReached = it.objective || '';
        if(s.mastered[k]){ it.status = 'done'; it.masteredAt = today; xp += XP.mastered; mastered.push(it); }
        else { it.objective = (s.newObjectives[k]||'').trim(); it.objectiveBy = it.objective ? who : null; it.objectiveAt = today; }
      } else xp += XP.progress;
    });
    p.sessions.push({
      date: today, ts,
      items: worked.map(([k,r]) => ({key:k, result:r})),
      followedPlan: !s.swapped && !!s.proposedKey && worked.some(([k]) => k===s.proposedKey),
      recordings: recs.map(r => ({songId:r.songId, ins:[...r.ins]})),
    });
    p.xp = xpBefore + xp;
    const cp = challengeProgress(who);
    if(!cp.done && cp.cur >= cp.ch.goal){ p.challenges[weekKey(today)] = today; msgs.push('⭐ Défi de la semaine relevé !'); }
    else if(!cp.done) msgs.push(`Défi de la semaine : ${cp.ch.text} (${cp.cur}/${cp.ch.goal}).`);
    if(bestMult > 1) msgs.unshift(`🎚️ Multiplicateur ×${bestMult} sur l'enregistrement.`);
    if(comeback) msgs.unshift('Content de te revoir au studio !');
    const fresh = checkBadges(who);
    return {comeback, msgs, mastered, fresh, gain: p.xp - xpBefore};
  });
  if(!res) return;
  res.mastered.forEach(it => addMastery(who, it.songId, it.ins));
  // Duo, morceau en boîte… peuvent aussi se débloquer pour l'autre.
  studioMusicians().forEach(m => { if(m.id!==who) updateProgress(m.id, () => checkBadges(m.id)); });
  const levelAfter = levelOf(progress[who].xp);
  toast = {title: res.comeback ? 'Content de te revoir !' : res.fresh.length ? 'Bravo !' : 'Bien joué !', msg: res.msgs.join(' '), xp: res.gain, badges: res.fresh, next: nextGoal(who),
    levelUp: levelAfter>levelBefore ? `${levelAfter} · ${levelTitle(levelAfter)}` : null, cta:'Place au jeu libre'};
  session = null; saveSession();
  stopTimer(); metroStop();
  render();
}

function stopTimer(){ timer = {step:null, endAt:null, remaining:null}; if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } wakeLockUpdate(); }
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(t => { const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=880; g.gain.value=0.15; o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.2); });
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
  }catch(e){}
}
function tick(){
  if(!timer.step || !timer.endAt) return;
  const rem = (timer.endAt - Date.now())/1000;
  const el = document.getElementById('timer-'+timer.step);
  if(rem <= 0){ beep(); const id=timer.step; stopTimer(); const e2=document.getElementById('timer-'+id); if(e2){ e2.textContent='✓ terminé'; e2.classList.remove('running'); } return; }
  if(el) el.textContent = '⏸ ' + fmtTime(rem);
}

    });
    render();
  });

function csvEscape(val){
  const s = String(val ?? '');
  if(/[;"\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function exportCSV(){
  const header = ['N°','Titre','Artiste', ...musicians.map(m => m.universal ? m.name+' (backup universel)' : m.name)];
  const rows = songs.map(song => {
    const row = [song.id, song.title, song.artist];
    musicians.forEach(m => {
      if(m.universal) row.push('backup — tous instruments');
      else row.push((mastery[m.id][song.id]||[]).join(' + '));
    });
    return row;
  });
  const lines = [header, ...rows].map(r => r.map(csvEscape).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF' + lines], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'repertoire.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function parseCSVLine(line){
  const fields = [];
  let cur = '', inQuotes = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = false;
      } else cur += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ';'){ fields.push(cur); cur=''; }
      else cur += ch;
    }
  }
  fields.push(cur);
  return fields;
}

function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  return text.split(/\r\n|\n|\r/).filter(l => l.trim().length).map(parseCSVLine);
}

function handleImportFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const rows = parseCSV(e.target.result);
      if(rows.length < 2) throw new Error('fichier vide ou format inattendu');
      const header = rows[0];
      const musicianCols = header.slice(3);
      if(musicianCols.length === 0) throw new Error('aucune colonne musicien trouvée');

      const seenIds = {};
      const newMusicians = musicianCols.map(h => {
        const universal = /\(backup universel\)/i.test(h);
        const name = h.replace(/\s*\(backup universel\)\s*/i, '').trim() || 'musicien';
        let id = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'') || 'musicien';
        if(seenIds[id]){ seenIds[id]++; id = id + seenIds[id]; } else seenIds[id] = 1;
        return {id, name, universal};
      });

      const newSongs = [];
      const newMastery = {};
      newMusicians.forEach(m => { newMastery[m.id] = {}; });

      rows.slice(1).forEach((r, idx) => {
        const title = (r[1]||'').trim();
        if(!title) return;
        const parsedId = parseInt(r[0], 10);
        const id = Number.isFinite(parsedId) ? parsedId : (idx+1);
        const artist = (r[2]||'').trim();
        newSongs.push({id, title, artist});
        newMusicians.forEach((m, ci) => {
          if(m.universal) return;
          const cell = (r[3+ci]||'').trim();
          if(!cell) return;
          const instruments = cell.split('+').map(s=>s.trim()).filter(s => INSTRUMENTS.some(i=>i.key===s));
          if(instruments.length) newMastery[m.id][id] = instruments;
        });
      });

      if(newSongs.length === 0) throw new Error('aucun morceau reconnu dans le fichier');

      importError = null;
      pendingImport = {musicians:newMusicians, songs:newSongs, mastery:newMastery};
      render();
    }catch(err){
      importError = 'Fichier illisible (' + err.message + ').';
      pendingImport = null;
      render();
    }
  };
  reader.onerror = () => { importError = 'Impossible de lire le fichier.'; render(); };
  reader.readAsText(file, 'UTF-8');
}

      if(file) handleImportFile(file);
      importInput.value = '';
    };
  }

  const cancelImportBtn = document.getElementById('cancel-import-csv');
  if(cancelImportBtn) cancelImportBtn.onclick = () => { pendingImport = null; render(); };

  const confirmImportBtn = document.getElementById('confirm-import-csv');
  if(confirmImportBtn) confirmImportBtn.onclick = async () => {
    const data = pendingImport;
    if(!data) return;
    pendingImport = null; importBusy = true; render();
    try{
      await manualBackup('avant-import');
      // La progression suit les morceaux par leur titre, même si l'import les renumérote.
      const titleToNewId = {};
      data.songs.forEach(x => titleToNewId[normTitle(x.title)] = x.id);
      const remap = (oldId) => { const old = songById(oldId); return old ? titleToNewId[normTitle(old.title)] : undefined; };
      const newProgress = {};
      Object.entries(progress).forEach(([mid, p]) => {
        const np = clone(p); np.items = {};
        Object.values(p.items).forEach(it => { const nid = remap(it.songId); if(nid!=null){ const k = nid+'|'+it.ins; np.items[k] = {...it, songId:nid}; } });
        np.sessions = p.sessions.map(se => ({...se,
          items: (se.items||[]).map(i => { const [sid,ins] = i.key.split('|'); const nid = remap(sid); return nid!=null ? {...i, key:nid+'|'+ins} : null; }).filter(Boolean),
          recordings: (se.recordings||[]).map(r => { const nid = remap(r.songId); return nid!=null ? {...r, songId:nid} : null; }).filter(Boolean)}));
        newProgress[mid] = np;
      });
      const newGigs = clone(gigs);
      Object.values(newGigs).forEach(g => g.songIds = (g.songIds||[]).map(remap).filter(x => x!=null));
      await store.set('songs', data.songs);
      await store.set('musicians', data.musicians);
      for(const m of data.musicians) await store.set('mastery:'+m.id, data.mastery[m.id]);
      for(const [mid,p] of Object.entries(newProgress)) if(data.musicians.some(m=>m.id===mid)) await store.set('progress:'+mid, p);
      await store.set('gigs', newGigs);
      selectedForSetlist = new Set(data.musicians.filter(m=>!m.universal).map(m=>m.id));
    }catch(e){ importError = "L'import a échoué en cours de route. Une sauvegarde a été faite juste avant : restaure-la depuis Réglages."; }
    importBusy = false; render();
  };

  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { activeTab = t.dataset.tab; render(); });

  const search = document.getElementById('search');
  if(search){
    search.addEventListener('input', () => { searchQuery = search.value; renderPartial(true); });
  }

  const sortSelect = document.getElementById('sort-select');
  if(sortSelect) sortSelect.onchange = (e) => { sortMode = e.target.value; renderPartial(); };

  const groupToggle = document.getElementById('group-toggle');
  if(groupToggle) groupToggle.onchange = (e) => { groupByArtist = e.target.checked; renderPartial(); };

  const addSongBtn = document.getElementById('add-song-btn');
  if(addSongBtn) addSongBtn.onclick = () => { addSongFormOpen = !addSongFormOpen; renderPartial(); };

  const confirmNewSong = document.getElementById('confirm-new-song');
  if(confirmNewSong) confirmNewSong.onclick = () => {
    const titleInput = document.getElementById('new-song-title');
    const artistInput = document.getElementById('new-song-artist');
    const title = titleInput.value.trim();
    if(!title) return;
    const artist = artistInput.value.trim();
    const newId = songs.length ? Math.max(...songs.map(s=>s.id))+1 : 1;
    songs.push({id:newId, title, artist});
    addSongFormOpen = false;
    renderPartial();
    save('songs', cur => { cur = cur || []; if(cur.some(x => normTitle(x.title)===normTitle(title) && normTitle(x.artist)===normTitle(artist))) return cur;
      cur.push({id: cur.length ? Math.max(...cur.map(x=>x.id))+1 : 1, title, artist}); return cur; });
  };

  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const id = c.dataset.musician;
    if(selectedForSetlist.has(id)) selectedForSetlist.delete(id); else selectedForSetlist.add(id);
    render();
  });

  const musicianSelect = document.getElementById('musician-select');
  if(musicianSelect) musicianSelect.onchange = (e) => { selectedGridMusician = e.target.value || null; if(selectedGridMusician){ studioWho = selectedGridMusician; lsSet('setlistas-who', studioWho); } render(); };

  const newMusicianBtn = document.getElementById('new-musician-btn');
  if(newMusicianBtn) newMusicianBtn.onclick = () => {
    document.getElementById('new-musician-form').classList.toggle('open');
  };

  const confirmBtn = document.getElementById('confirm-new-musician');
  if(confirmBtn) confirmBtn.onclick = async () => {
    const nameInput = document.getElementById('new-musician-name');
    const name = nameInput.value.trim();
    if(!name) return;
    let id = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'') || 'musicien';
    if(musicians.some(m=>m.id===id)) id = id + Math.floor(Math.random()*1000);
    const newMusician = {id, name};
    musicians.push(newMusician);
    mastery[id] = {};
    selectedGridMusician = id;
    studioWho = id; lsSet('setlistas-who', id);
    render();
    await save('musicians', cur => { cur = cur || []; if(!cur.some(m=>m.id===id)) cur.push(newMusician); return cur; });
    await save('mastery:'+id, cur => cur || {});
  };

  const deleteBtn = document.getElementById('delete-musician-btn');
  if(deleteBtn) deleteBtn.onclick = () => { pendingDeleteMusician = selectedGridMusician; render(); };

  const cancelDeleteBtn = document.getElementById('cancel-delete-musician');
  if(cancelDeleteBtn) cancelDeleteBtn.onclick = () => { pendingDeleteMusician = null; render(); };

  const confirmDeleteBtn = document.getElementById('confirm-delete-musician');
  if(confirmDeleteBtn) confirmDeleteBtn.onclick = async () => {
    const id = pendingDeleteMusician;
    pendingDeleteMusician = null; selectedGridMusician = null; selectedForSetlist.delete(id);
    if(studioWho===id){ studioWho = null; lsSet('setlistas-who', null); }
    render();
    await manualBackup('avant-suppression-'+id);
    await save('musicians', cur => (cur||[]).filter(m => m.id!==id));
    await store.remove('mastery:'+id).catch(()=>{});
    await store.remove('progress:'+id).catch(()=>{});
  };

  document.querySelectorAll('.toggle-btn').forEach(btn => btn.onclick = () => {
    if(!selectedGridMusician) return;
    const songId = btn.dataset.song;
    const ins = btn.dataset.ins;
    const current = mastery[selectedGridMusician][songId] || [];
    const idx = current.indexOf(ins);
    if(idx>=0) current.splice(idx,1); else current.push(ins);
    mastery[selectedGridMusician][songId] = current;
    const mid = selectedGridMusician, on = idx < 0;
    render();
    save('mastery:'+mid, m => { m = m || {}; const a = (m[songId]||[]).filter(x => x!==ins); if(on) a.push(ins); m[songId] = a; return m; });
  });
}

function parseDur(s){ const m = String(s||'').trim().match(/^(\d+):(\d{1,2})$/); return m ? Number(m[1])*60+Number(m[2]) : 0; }
function fmtDur(sec){ if(!sec) return ''; const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s2 = sec%60; return (h? h+' h ' : '') + (h ? String(m).padStart(2,'0') : m) + ' min' + (s2 && !h ? ' ' + String(s2).padStart(2,'0') + ' s' : ''); }

function gigList(){ return Object.entries(gigs).map(([id,g]) => ({id, ...g})).sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (a.name||'').localeCompare(b.name||'')); }
function coverageFor(song, mids){
  const parts = INSTRUMENTS.map(ins => {
    const names = musicians.filter(m => mids.includes(m.id) && !m.universal && (mastery[m.id][song.id]||[]).includes(ins.key)).map(m=>m.name);
    return names.length ? `${ins.abbr} ${names.join('/')}` : null;
  }).filter(Boolean);
  return parts.join(', ');
}

    </form>

      <summary>Règles Firebase définitives</summary>

function attachSettingsEvents(){
  document.querySelectorAll('[data-restore]').forEach(b => b.onclick = async () => {
    const k = b.dataset.restore, bk = lastAll[k];
    if(!bk || !confirm(`Restaurer la sauvegarde ${k.replace('backup:','')} ? Les données actuelles seront remplacées (une sauvegarde de l'état actuel est faite avant).`)) return;
    b.disabled = true; b.textContent = 'Restauration…';
    await manualBackup('avant-restauration');
    const data = bk.data || {};
    const keep = new Set(Object.keys(data));
    for(const [key,v] of Object.entries(data)) await store.set(key, v);
    for(const key of Object.keys(lastAll)) if((key.startsWith('mastery:')||key.startsWith('progress:')) && !keep.has(key)) await store.remove(key);
    b.textContent = 'Restaurée';
  });
  const bn = document.getElementById('backup-now'); if(bn) bn.onclick = async () => { bn.disabled = true; await manualBackup('manuelle'); bn.textContent = 'Sauvegarde faite'; };
  const ex = document.getElementById('export-json'); if(ex) ex.onclick = () => {
    const blob = new Blob([JSON.stringify(snapshotOf(lastAll), null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'setlistas-' + todayStr() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
  };
  const pf = document.getElementById('pw-change');
  if(pf) pf.onsubmit = async (e) => {
    e.preventDefault();
    const msg = document.getElementById('pw-msg'), btn = pf.querySelector('button');
    const a = document.getElementById('pw-new').value.trim(), b = document.getElementById('pw-new2').value.trim();
    if(a.length < 6){ msg.textContent = 'Au moins 6 caractères.'; return; }
    if(a !== b){ msg.textContent = 'Les deux saisies ne correspondent pas.'; return; }
    const newSpace = await deriveSpace(a), oldSpace = SPACE;
    if(newSpace === oldSpace){ msg.textContent = 'C\u2019est déjà le mot de passe actuel.'; return; }
    if(await store.getMeta(newSpace)){ msg.textContent = 'Ce mot de passe est déjà utilisé par un autre espace.'; return; }
    btn.disabled = true; msg.textContent = 'Transfert en cours…'; changingPassword = true;
    try{
      const all = clone(lastAll);
      await store.writeAll(newSpace, {...all, meta:{...(all.meta||{}), passwordChangedAt:new Date().toISOString()}});
      const remember = !!lsGet('setlistas-space');
      // L'ancien espace est vidé ; la méta en dernier, pour que les autres appareils basculent proprement.
      for(const k of Object.keys(all)) if(k!=='meta') await store.removeIn(oldSpace, k);
      await store.removeIn(oldSpace, 'meta');
      if(remember) lsSet('setlistas-space', newSpace); else { try{ sessionStorage.setItem('setlistas-space', newSpace); }catch(e){} }
      location.reload();
    }catch(err){
      console.warn(err); btn.disabled = false; changingPassword = false;
      msg.textContent = 'Échec du changement. Rien n\u2019a été perdu : réessaie.';
    }
  };
  const fg = document.getElementById('forget-device'); if(fg) fg.onclick = () => {
    if(!confirm('Oublier le mot de passe ? Il faudra le ressaisir sur cet appareil.')) return;
    lsSet('setlistas-space', null); try{ sessionStorage.removeItem('setlistas-space'); }catch(e){}
    location.reload();
  };
}

let gate = {step:'login', error:null};
function renderGate(){
  const app = document.getElementById('app');
  if(gate.step==='create'){
    app.innerHTML = `<main class="gate">
      <h1>Protéger l'appli</h1>
      <p>Ce mot de passe n'existe pas encore. Si tu le confirmes, il deviendra le mot de passe du groupe et toutes les données actuelles y seront transférées.</p>
      <form id="gate-form" autocomplete="on">
        <input type="text" name="username" value="setlistas" autocomplete="username" hidden>
        <label class="field"><span>Confirme le mot de passe</span><input type="password" id="gate-confirm" autocomplete="new-password" required autofocus></label>
        <button class="btn big" type="submit">Protéger avec ce mot de passe</button>
        <button class="link-btn" type="button" id="gate-back">C'était une faute de frappe</button>
        ${gate.error ? `<p class="error" role="alert">${escapeHtml(gate.error)}</p>` : ''}
      </form></main>`;
    document.getElementById('gate-back').onclick = () => { gate = {step:'login', error:null}; renderGate(); };
  } else {
    app.innerHTML = `<main class="gate">
      <h1>Répertoire</h1>
      <p>Entre le mot de passe du groupe.</p>
      <form id="gate-form" autocomplete="on">
        <input type="text" name="username" value="setlistas" autocomplete="username" hidden>
        <label class="field"><span>Mot de passe</span><input type="password" id="gate-pw" autocomplete="current-password" required autofocus></label>
        <label class="check"><input type="checkbox" id="gate-remember" checked> Se souvenir sur cet appareil</label>
        <button class="btn big" type="submit">Entrer</button>
        ${gate.error ? `<p class="error" role="alert">${escapeHtml(gate.error)}</p>` : ''}
      </form></main>`;
  }
  document.getElementById('gate-form').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
    try{
      if(gate.step==='create'){
        if(document.getElementById('gate-confirm').value.trim() !== gate.pw){ gate.error = 'Les deux saisies ne correspondent pas.'; return renderGate(); }
        const legacy = gate.legacy, space = gate.space, now = new Date().toISOString();
        await store.writeAll(space, {...legacy, meta:{createdAt:now, version:2}, ['backup:'+todayStr()+'-migration']:{at:now, data:legacy}});
        await store.deleteLegacy(Object.keys(legacy));
        enter(space, gate.remember);
        return;
      }
      const pw = document.getElementById('gate-pw').value.trim();
      const remember = document.getElementById('gate-remember').checked;
      const space = await deriveSpace(pw);
      if(await store.getMeta(space)) return enter(space, remember);
      const legacy = await store.legacyAll();
      if(legacy.songs){
        if(pw.length < 6){ gate.error = 'Choisis un mot de passe d’au moins 6 caractères.'; return renderGate(); }
        gate = {step:'create', error:null, pw, space, legacy, remember}; return renderGate();
      }
      gate.error = 'Mot de passe incorrect.'; renderGate();
    }catch(err){
      console.warn(err);
      gate.error = (err && err.code==='permission-denied')
        ? 'La base Firebase refuse l\u2019accès : les nouvelles règles de sécurité ne sont pas encore publiées.'
        : 'Connexion impossible. Vérifie le réseau et réessaie.';
      renderGate();
    }
  };
}
function enter(space, remember){
  SPACE = space;
  if(remember) lsSet('setlistas-space', space);
  else { lsSet('setlistas-space', null); try{ sessionStorage.setItem('setlistas-space', space); }catch(e){} }
  start();
}
function boot(){
  let saved = lsGet('setlistas-space');
  if(!saved){ try{ saved = sessionStorage.getItem('setlistas-space'); }catch(e){} }
  if(saved){ SPACE = saved; start(); } else renderGate();
}

boot();
</script>
